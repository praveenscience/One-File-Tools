<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge CI Lab</title>
<style>
:root{--bg:#ebe8fb;--c:#fff;--ink:#22203a;--mu:#7a779b;--v:#7c5cf5;--v2:#e4defc;--pe:#fcdcd2;--sk:#d3e8f8;--g:#18a37d;--r:#e5566d;--ln:#e6e2f7;--cur:#dff5ea;--inc:#dfeafb;--code:#faf9ff;--sh:0 10px 30px rgba(110,90,200,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#17152b;--c:#221f40;--ink:#eceaff;--mu:#a5a2cc;--v:#9b82ff;--v2:#352f66;--pe:#4a2f38;--sk:#274260;--g:#3fd6aa;--r:#ff7d92;--ln:#37326a;--cur:#133a2f;--inc:#182c4f;--code:#1b1934;--sh:0 10px 30px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(600px 300px at 0 0,var(--sk),transparent 70%),var(--bg);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:var(--v2);color:var(--ink);border-radius:999px;padding:7px 14px;transition:transform .15s,background .15s}
button:hover:not(:disabled){transform:translateY(-1px);background:var(--v);color:#fff}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--v);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.app{max-width:1120px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.logo{font-size:21px;font-weight:700;letter-spacing:-.02em}.logo b{color:var(--v)}
.seg{display:flex;gap:4px;background:var(--c);padding:4px;border-radius:999px;box-shadow:var(--sh)}
.seg button{background:none;padding:6px 16px}.seg button.on{background:var(--v);color:#fff}
.card{background:var(--c);border-radius:24px;padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr 1fr}.play{grid-template-columns:1fr!important}}
@media(max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.hero{background:var(--v);color:#fff}.hero p{opacity:.9}
.hero h2{font-size:27px;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
.hero button{background:#fff;color:#4b35c9;font-weight:700;margin:6px 8px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tile.p{background:var(--v2)}.tile small{color:var(--mu)}
.rg{position:relative;width:64px;height:64px}.rg svg{width:100%;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:4}.rb{stroke:var(--ln)}.rf{stroke:var(--v);stroke-linecap:round;transition:stroke-dasharray .8s}
.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px;cursor:pointer;border:0;color:var(--ink);background:var(--c);border-radius:20px;box-shadow:var(--sh)}
.qa span{font-size:22px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--v2)}
.qa:nth-child(2) span{background:var(--pe)}.qa:nth-child(3) span{background:var(--sk)}
h3{margin:18px 0 8px;font-size:17px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--c);border-radius:18px;margin-bottom:8px;box-shadow:var(--sh)}
.row .n{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;background:var(--v2);flex:none}
.row:nth-child(3n+2) .n{background:var(--pe)}.row:nth-child(3n) .n{background:var(--sk)}
.row div{flex:1;min-width:0}.row small{color:var(--mu);display:block}
.st{color:#f0a020;letter-spacing:2px}
.mu{color:var(--mu);font-size:13px}
.chip{display:inline-block;background:var(--v2);border-radius:999px;padding:2px 10px;font-size:12px;margin:0 4px 4px 0}
.play{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.steps button{padding:5px 12px;font-size:13px}.steps button.on{background:var(--v);color:#fff}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}
#tabs{display:flex;gap:6px;flex-wrap:wrap}#tabs button{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
#tabs button.on{background:var(--ink);color:var(--c)}#tabs i{font-style:normal;color:var(--pe);margin-left:6px;background:var(--r);color:#fff;border-radius:99px;padding:0 6px;font-size:11px}
#code,#ed{background:var(--code);border-radius:16px;border:1px solid var(--ln);font:13px/1.55 ui-monospace,Menlo,Consolas,monospace}
#code{padding:8px 0;overflow:auto;max-height:420px}
.r{display:grid;grid-template-columns:42px 1fr;white-space:pre}
.r i{color:var(--mu);text-align:right;padding-right:12px;font-style:normal;user-select:none}
.cf{margin:6px 8px;border-radius:12px;overflow:hidden;border:1px solid var(--ln)}
.lens{background:var(--v2);padding:6px 12px;font:12px system-ui;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lens span{color:var(--mu);margin-right:4px}.lens button{padding:3px 10px;font-size:12px;background:var(--c)}
.cur{background:var(--cur)}.inc{background:var(--inc)}.mk{color:var(--mu)}
.cu code::after{content:"   Current Change";color:var(--g)}.in code::after{content:"   Incoming Change";color:var(--v)}
.cu{background:var(--cur)}.in{background:var(--inc)}
#ed{width:100%;height:330px;padding:12px;color:var(--ink);resize:vertical;tab-size:2}
.ok{color:var(--g);font-weight:600;padding:6px 14px;font-family:system-ui}
svg.gr{width:100%}svg.gr text{fill:var(--mu);font:11px system-ui}
.gl{stroke:var(--ln);stroke-width:3;fill:none}.cm{fill:var(--c);stroke:var(--v);stroke-width:3}
.mn{fill:#f0a020;transition:fill .4s}.mn.pass{fill:var(--g)}.mn.fail{fill:var(--r)}
#run{background:var(--v);color:#fff;font-weight:700;padding:9px 18px}
#ci{list-style:none;margin:8px 0 0;padding:0}
#ci li{display:grid;grid-template-columns:24px 1fr;padding:6px 0;border-bottom:1px dashed var(--ln);animation:in .25s both}
#ci small{grid-column:2;color:var(--r);font-family:ui-monospace,monospace;font-size:12px;word-break:break-word}
#ci .p b{color:var(--g)}#ci .f b{color:var(--r)}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
#win{display:none;margin-top:12px;padding:14px;border-radius:18px;background:var(--v2)}#win.show{display:block}
#win h4{margin:0 0 4px;font-size:17px}
pre.cmd{background:var(--ink);color:var(--c);padding:10px 12px;border-radius:12px;margin:8px 0 0;font:12.5px ui-monospace,monospace;overflow:auto}
.an code{display:block;padding:6px 12px;border-radius:10px;cursor:pointer;font:13px ui-monospace,monospace;margin:3px 0;background:var(--code);border:2px solid transparent;white-space:pre}
.an code.on{border-color:var(--v)}
.ck{display:flex;gap:10px;padding:10px;border-radius:14px;background:var(--code);margin-bottom:6px;cursor:pointer;border:0;width:100%;text-align:left;border-radius:14px;color:var(--ink)}
.ck.on{opacity:.55;text-decoration:line-through}.ck:hover{background:var(--v2);color:var(--ink);transform:none}
.hud{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.hud .chip{font-weight:700;margin:0}
.tb{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin-bottom:10px}.tb i{display:block;height:100%;width:100%;background:var(--g);transition:width .25s linear}.tb.low i{background:var(--r)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">Merge<b>CI</b> Lab</div><div class="seg" id="nav"></div></div>
  <div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const E=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const KEY="merge-ci-lab";
const LV=[
{n:"Tax and discount",ex:"total",
 brief:"main applies 18% tax. feature/bulk-discount gives 10% off when the subtotal is over 1000. Both rules ship: discount first, then tax on the result.",
 hint:"Neither side is complete. Compute a discounted amount first, then round that amount times 1.18.",
 real:"Neither Accept button is right. In VS Code you would edit the lines by hand so the discount feeds into the tax.",
 files:[["price.js",`function total(items) {
  const sum = items.reduce((s, i) => s + i.price * i.qty, 0);
<<<<<<< HEAD
  return Math.round(sum * 1.18);
=======
  return sum > 1000 ? sum * 0.9 : sum;
>>>>>>> feature/bulk-discount
}`]],
 tests:[["Small cart: 200 becomes 236",o=>o.total([{price:100,qty:2}])===236],["Big cart: 1500 becomes 1593",o=>o.total([{price:500,qty:3}])===1593],["Empty cart is 0",o=>o.total([])===0]]},
{n:"Config twins",ex:"config",
 brief:"Two branches both edited the config. Production needs the new host, retries and timeout, and must not ship with debug logging on.",
 hint:"The first conflict adds different keys on each side, so both belong. The second is one key with two values.",
 real:"Accept Both is right when each side adds something different. When both set the same key, pick one.",
 files:[["config.js",`const config = {
  port: 3000,
<<<<<<< HEAD
  host: "0.0.0.0",
  retries: 3,
=======
  timeout: 5000,
>>>>>>> feat/timeout
<<<<<<< HEAD
  debug: false,
=======
  debug: true,
>>>>>>> chore/local-debug
};`]],
 tests:[["port is 3000",o=>o.config.port===3000],["host is 0.0.0.0",o=>o.config.host==="0.0.0.0"],["retries is 3",o=>o.config.retries===3],["timeout is 5000",o=>o.config.timeout===5000],["debug is off",o=>o.config.debug===false]]},
{n:"Two files",ex:"pageCount,safePage",
 brief:"Release notes say the page size is now 25. Two files conflict and must load together. Watch for names declared twice.",
 hint:"The two clamp versions behave the same, so keep one. Keeping both redeclares the constant and breaks the build.",
 real:"Git cannot see that two files now declare the same name. Always run the build after Accept Both.",
 files:[["utils.js",`<<<<<<< HEAD
const clamp = (n, lo, hi) => Math.min(Math.max(n, lo), hi);
=======
const clamp = (n, lo, hi) => Math.max(lo, Math.min(n, hi));
>>>>>>> refactor/clamp
const sum = (a) => a.reduce((x, y) => x + y, 0);`],["app.js",`<<<<<<< HEAD
const PAGE_SIZE = 10;
=======
const PAGE_SIZE = 25;
>>>>>>> feat/bigger-pages
const pageCount = (n) => Math.ceil(n / PAGE_SIZE);
const safePage = (p, n) => clamp(p, 1, pageCount(n));`]],
 tests:[["100 items make 4 pages",o=>o.pageCount(100)===4],["page 9 clamps to 4",o=>o.safePage(9,100)===4],["page 0 clamps to 1",o=>o.safePage(0,100)===1]]},
{n:"Slug surgery",ex:"slugify",
 brief:"fix/non-strings makes slugify accept numbers. fix/edge-dashes trims stray dashes. Both fixes are needed and the two conflicts must agree.",
 hint:"Take the incoming side of each conflict. Lowercasing moves to the return line, so the early lowercase is no longer needed.",
 real:"Conflicts in one file can need different answers. Resolve them one at a time, then test the whole file.",
 files:[["slugify.js",`function slugify(s) {
<<<<<<< HEAD
  s = s.trim().toLowerCase();
=======
  s = String(s).trim();
>>>>>>> fix/non-strings
  s = s.replace(/[^a-z0-9]+/gi, "-");
<<<<<<< HEAD
  return s;
=======
  return s.toLowerCase().replace(/^-+|-+$/g, "");
>>>>>>> fix/edge-dashes
}`]],
 tests:[["Hello World! becomes hello-world",o=>o.slugify("  Hello World! ")==="hello-world"],["Numbers work: 42",o=>o.slugify(42)==="42"],["Edge dashes trimmed",o=>o.slugify("--A--b")==="a-b"]]},
{n:"Stock room",ex:"order,stock",
 brief:"Final boss. reserve() must reject unknown items, non-positive amounts and over-ordering. order() returns OK, SOLD_OUT or UNKNOWN. Stock must never change on a rejected order.",
 hint:"Write one reserve() with all three checks in a single if. In order(), check for the unknown item first, then fall through to SOLD_OUT.",
 real:"Real conflicts often need a hand-written merge of both intentions. Trust the tests, not the missing markers.",
 files:[["inventory.js",`const stock = { apple: 5, pear: 2 };
<<<<<<< HEAD
function reserve(item, n) {
  if (stock[item] < n) return false;
  stock[item] -= n;
  return true;
}
=======
function reserve(item, n) {
  if (!(item in stock) || n <= 0) return false;
  stock[item] -= n;
  return true;
}
>>>>>>> fix/validate-input`],["orders.js",`function order(item, n) {
<<<<<<< HEAD
  return reserve(item, n) ? "OK" : "SOLD_OUT";
=======
  if (!(item in stock)) return "UNKNOWN";
  return reserve(item, n) ? "OK" : "FAILED";
>>>>>>> feat/unknown-status
}`]],
 tests:[["apple x2 is OK",o=>o.order("apple",2)==="OK"],["apple x9 is SOLD_OUT",o=>o.order("apple",9)==="SOLD_OUT"],["kiwi is UNKNOWN",o=>o.order("kiwi",1)==="UNKNOWN"],["pear x-1 is rejected",o=>o.order("pear",-1)!=="OK"],["rejected orders leave stock alone",o=>o.stock.apple===3&&o.stock.pear===2]]}
];
const TM=[75,100,120,120,180];
const WHY=[
"Both branches changed the same line, so Git cannot guess. Tax and discount are two separate rules that must be chained, so neither side alone is correct.",
"The two conflicts look alike but differ. The first adds different keys on each side (keep both). The second sets one key twice (pick one, and production must keep debug off).",
"Both branches touched the same lines, and Git only compares text. It cannot see that keeping both clamp versions declares the same name twice and breaks the build.",
"Two fixes edited neighbouring lines of one function. Each conflict needed the incoming side because the lowercasing moved to the return line, so the two resolutions must agree.",
"Different branches added validation and a new status to the same functions. The fix is one hand-written reserve() with every check, plus an order() that returns consistent statuses."];
let SC=[];try{SC=JSON.parse(localStorage.getItem(KEY+"-sc"))||[]}catch(e){}
const AN=[["<<<<<<< HEAD","Start of the conflict. HEAD is the branch you are on, shown as the Current Change."],["const mode = \"dark\";","Current Change: your version of these lines."],["=======","The divider. Above it is yours, below it is theirs."],["const mode = \"light\";","Incoming Change: the version from the branch being merged in."],[">>>>>>> feature/theme","End of the conflict, labelled with the incoming branch name."]];
const CK=[["Merge and read the message","git merge feature prints CONFLICT (content). Git paused the merge and is waiting for you."],["Find the files","git status lists them as both modified. In VS Code they show a ! in the Source Control panel."],["Resolve each conflict","Use Accept Current, Incoming or Both, or edit by hand. Delete every marker line."],["Prove it works","Run the build and tests. Git only checks text, not whether the code still works."],["Stage and finish","git add the file, then git commit (or git merge --continue). On GitHub: Mark as resolved, then Commit merge."]];
let P=[];try{P=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const S={i:0,f:0,files:[],runs:0,hint:false,hinted:false,hp:0,left:0,over:false,done:false,score:0,streak:0,md:"v",armed:false};
let V="home",AI=0,CKD=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
const ring=(p,t)=>`<div class="rg"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="rb"/><circle cx="18" cy="18" r="15" class="rf" stroke-dasharray="${p*94.2} 94.2"/></svg><b>${t}</b></div>`;
function parse(t){const L=t.split("\n"),H=[];let s=-1,m=-1;
 L.forEach((l,i)=>{if(l.startsWith("<<<<<<<")){s=i;m=-1}else if(l.trim()==="======="&&s>=0)m=i;else if(l.startsWith(">>>>>>>")&&s>=0&&m>=0){H.push({s,m,e:i});s=-1;m=-1}});return{L,H}}
function take(t,k,mode){const{L,H}=parse(t),h=H[k],o=L.slice(h.s+1,h.m),n=L.slice(h.m+1,h.e);
 L.splice(h.s,h.e-h.s+1,...(mode==="o"?o:mode==="t"?n:[...o,...n]));return L.join("\n")}
function load(i){Object.assign(S,{i,f:0,runs:0,hint:false,hinted:false,hp:0,left:TM[i],over:false,done:false,md:"v",armed:false,files:LV[i].files.map(x=>x[1])})}
function nextLv(){const n=LV.findIndex((_,i)=>!P[i]);return n<0?0:n}
function render(){
 $("#nav").innerHTML=[["home","Home"],["learn","Learn"],["play","Play"]].map(a=>`<button data-v="${a[0]}" class="${V===a[0]?"on":""}">${a[1]}</button>`).join("");
 $("#view").innerHTML=V==="home"?home():V==="learn"?learn():play();
 if(V==="play")drawPlay()}
function home(){const d=LV.filter((_,i)=>P[i]).length,st=LV.reduce((a,_,i)=>a+(P[i]||0),0),n=nextLv();
 return`<div class="grid g2"><div class="card hero"><h2>Resolve real merge conflicts with confidence</h2><p>Practise the exact choices you will see in VS Code and GitHub, then run CI to prove your merge actually works.</p><button data-go="${n}">${d?"Continue: level "+(n+1):"Start level 1"}</button><button data-v="learn">Learn the basics</button></div>
 <div class="tiles"><div class="card tile p">${ring(d/LV.length,d+"/"+LV.length)}<strong>Levels cleared</strong><small>Pass CI to clear</small></div><div class="card tile">${ring(st/(LV.length*3),st)}<strong>Stars earned</strong><small>of ${LV.length*3} possible</small></div></div></div>
 <h3>Quick actions</h3><div class="grid g3"><button class="qa" data-go="${n}"><span>▶</span>Play next</button><button class="qa" data-v="learn"><span>🧩</span>Conflict anatomy</button><button class="qa" data-v="learn"><span>✅</span>Real-world checklist</button><button class="qa" id="wipe"><span>↺</span>${S.wipe?"Click to confirm":"Reset progress"}</button></div>
 <h3>Missions</h3>${LV.map((l,i)=>{const lk=i>0&&!P[i-1];return`<div class="row"><span class="n">${i+1}</span><div><strong>${E(l.n)}</strong><small>${l.files.length} file${l.files.length>1?"s":""}, ${l.files.reduce((a,f)=>a+parse(f[1]).H.length,0)} conflicts${SC[i]?", best "+SC[i]+" pts":""}</small></div><span class="st">${stars(P[i]||0)}</span><button data-go="${i}" ${lk?"disabled":""}>${lk?"Locked":P[i]?"Replay":"Play"}</button></div>`}).join("")}`}
function learn(){return`<div class="grid g2"><div class="card an"><h3 style="margin-top:0">Anatomy of a conflict</h3><p class="mu">Tap each line to see what it means.</p>${AN.map((a,i)=>`<code data-an="${i}" class="${i===AI?"on":""}">${E(a[0])}</code>`).join("")}<p style="margin:12px 0 0"><strong>${E(AN[AI][1])}</strong></p><p class="mu">To resolve: keep the code you want and delete all three marker lines.</p></div>
 <div class="card"><h3 style="margin-top:0">Where the buttons live</h3><span class="chip">VS Code</span><p class="mu" style="margin-top:0">Open a conflicted file. Accept Current Change, Accept Incoming Change and Accept Both Changes appear right above each conflict, exactly like in this lab.</p><span class="chip">GitHub</span><p class="mu" style="margin-top:0">On a pull request choose Resolve conflicts. Edit the file in the web editor, click Mark as resolved, then Commit merge.</p></div></div>
 <h3>Real-world checklist</h3>${CK.map((c,i)=>`<button class="ck ${CKD[i]?"on":""}" data-ck="${i}"><span>${CKD[i]?"✅":"⬜"}</span><span><strong>${c[0]}</strong><br><span class="mu">${E(c[1])}</span></span></button>`).join("")}<p><button data-go="${nextLv()}">Practise now</button></p>`}
function play(){return`<div class="steps">${LV.map((l,i)=>`<button data-go="${i}" class="${i===S.i?"on":""}">${i+1}. ${E(l.n)}</button>`).join("")}</div>
 <div class="play"><section><div class="card" id="brief"></div><div class="card" style="margin-top:14px"><div class="bar"><div id="tabs"></div><div class="seg" id="mode"></div></div><div id="code"></div><textarea id="ed" spellcheck="false" hidden aria-label="Final file content"></textarea></div></section>
 <aside><div class="card"><div class="hud"><span class="chip" id="tl"></span><span class="chip" id="sc"></span><span class="chip" id="sk"></span></div><div class="tb" id="tb"><i id="tf"></i></div><svg class="gr" viewBox="0 0 240 78" role="img" aria-label="Branch graph"><path class="gl" d="M12 58H228"/><path class="gl" d="M52 58C66 58 66 20 86 20H140C160 20 160 58 176 58"/><circle class="cm" cx="30" cy="58" r="6"/><circle class="cm" cx="52" cy="58" r="6"/><circle class="cm" cx="96" cy="20" r="6"/><circle class="cm" cx="130" cy="20" r="6"/><circle class="cm" cx="150" cy="58" r="6"/><circle class="mn" id="mn" cx="196" cy="58" r="9"/><text x="8" y="76">main</text><text x="98" y="8">feature</text><text id="mt" x="170" y="76">conflict</text></svg>
 <div class="bar"><button id="run">Mark as resolved and run CI</button><button id="hint">Hint</button><button id="reset">Reset</button></div><p class="mu" id="hb"></p></div>
 <div class="card" style="margin-top:14px"><strong>CI pipeline</strong><ul id="ci"><li><b></b><span class="mu">Resolve every conflict, then run CI.</span></li></ul><div id="win" role="status"></div></div></aside></div>`}
function drawPlay(){const lv=LV[S.i];
 $("#brief").innerHTML=`<strong style="font-size:18px">Level ${S.i+1}: ${E(lv.n)}</strong><p class="mu" style="margin:4px 0 0">${E(lv.brief)}</p>`;
 $("#tabs").innerHTML=lv.files.map((f,i)=>{const n=parse(S.files[i]).H.length;return`<button data-f="${i}" class="${i===S.f?"on":""}">${f[0]}${n?`<i>${n}</i>`:""}</button>`}).join("");
 $("#mode").innerHTML=[["v","Visual"],["e","Edit text"]].map(a=>`<button data-md="${a[0]}" class="${S.md===a[0]?"on":""}">${a[1]}</button>`).join("");
 const ed=S.md==="e";$("#ed").hidden=!ed;$("#code").hidden=ed;
 if(!ed){const t=S.files[S.f],{L,H}=parse(t);let h="",i=0,k=0;const row=(j,c)=>`<div class="r ${c}"><i>${j+1}</i><code>${E(L[j])||" "}</code></div>`;
  while(i<L.length){const c=H.find(x=>x.s===i);
   if(c){h+=`<div class="cf"><div class="lens"><span>Conflict ${k+1}</span>${[["o","Accept Current Change"],["t","Accept Incoming Change"],["b","Accept Both Changes"]].map(a=>`<button data-k="${k}" data-m="${a[0]}">${a[1]}</button>`).join("")}</div>`;
    for(let j=c.s;j<=c.e;j++)h+=row(j,j===c.s?"mk cu":j<c.m?"cur":j===c.m?"mk":j<c.e?"inc":"mk in");h+="</div>";i=c.e+1;k++}
   else{h+=row(i,"");i++}}
  $("#code").innerHTML=h+(H.length?"":'<div class="ok">No conflict markers left in this file.</div>')}
 else if($("#ed").value!==S.files[S.f])$("#ed").value=S.files[S.f];
 $("#hb").textContent=S.hint?lv.hint:"";$("#hint").textContent=S.hint?"Hide hint":S.hinted?"Show hint":"Hint (-50)";
 const lock=S.over||S.done;$("#code").style.pointerEvents=lock?"none":"";$("#ed").disabled=lock;$("#run").disabled=lock;hud();$("#reset").textContent=S.armed?"Sure?":"Reset"}
function run(){if(S.over||S.done)return;S.runs++;const lv=LV[S.i],code=S.files.join("\n"),out=[];
 const stray=S.files.some(t=>/^(<{7}|={7}$|>{7})/m.test(t));
 out.push(["Lint: no conflict markers",!stray,stray?"Conflict markers remain. Remove every <<<<<<<, ======= and >>>>>>> line.":""]);
 let ns=null;
 if(!stray){try{ns=new Function(code+"\nreturn {"+lv.ex+"};")();out.push(["Build: files load together",true,""])}catch(e){out.push(["Build: files load together",false,e.name+": "+e.message])}}else out.push(["Build: files load together",false,"Skipped"]);
 lv.tests.forEach(([n,f])=>{let p=false,m="";if(ns){try{p=!!f(ns)}catch(e){m=e.message}}else m="Skipped";out.push(["Test: "+n,p,p?"":m])});
 const ok=out.every(x=>x[1]);
 $("#ci").innerHTML=out.map((x,i)=>`<li class="${x[1]?"p":"f"}" style="animation-delay:${i*70}ms"><b>${x[1]?"✓":"✗"}</b><span>${E(x[0])}</span>${x[2]?`<small>${E(x[2])}</small>`:""}</li>`).join("");
 $("#mn").setAttribute("class","mn "+(ok?"pass":"fail"));$("#mt").textContent=ok?"merged":"red build";
 const w=$("#win");
 if(ok){let s=S.runs===1?3:S.runs<=3?2:1;if(S.hinted)s=Math.min(s,2);P[S.i]=Math.max(P[S.i]||0,s);save();S.done=true;const clean=S.runs===1&&!S.hinted;S.streak=clean?S.streak+1:0;const bonus=clean?25*(S.streak-1):0,pts=Math.max(10,100+Math.round(S.left)*2-S.hp*50-(S.runs-1)*20+bonus);S.score+=pts;SC[S.i]=Math.max(SC[S.i]||0,pts);try{localStorage.setItem(KEY+"-sc",JSON.stringify(SC))}catch(e){}hud();const last=S.i===LV.length-1,tot=P.reduce((a,b)=>a+(b||0),0);
  w.className="show";w.innerHTML=`<h4>CI is green <span class="st">${stars(s)}</span></h4><p class="mu" style="margin:0">${S.runs} run${S.runs>1?"s":""}${S.hinted?", hint used":""}. ${last?"All levels cleared with "+tot+" of "+LV.length*3+" stars.":""}</p><p style="margin:8px 0 0"><strong>+${pts} points</strong> <span class="mu">(${bonus?"streak bonus +"+bonus+", ":""}${Math.round(S.left)}s left${S.hp?", hint -"+S.hp*50:""}${S.runs>1?", extra runs -"+(S.runs-1)*20:""})</span></p><p style="margin:8px 0 0"><strong>Why:</strong> ${E(WHY[S.i])}</p><p style="margin:8px 0 0"><strong>In VS Code or GitHub:</strong> ${E(LV[S.i].real)}</p><p class="mu" style="margin:8px 0 0">Then finish the merge:</p><pre class="cmd">git add ${LV[S.i].files.map(f=>f[0]).join(" ")}\ngit commit</pre><p style="margin:10px 0 0">${last?'<button data-v="home">Back to home</button>':'<button data-go="'+(S.i+1)+'">Next level</button>'}</p>`;$("#tabs").scrollIntoView&&0}
 else{w.className="";S.streak=0;hud()}}
function hud(){const t=$("#tl");if(!t)return;t.textContent="⏱ "+Math.max(0,Math.ceil(S.left))+"s";$("#sc").textContent="Score "+S.score;$("#sk").textContent="🔥 Streak "+S.streak;$("#tb").className="tb"+(S.left<=15&&!S.done?" low":"");$("#tf").style.width=Math.max(0,S.left/TM[S.i]*100)+"%"}
function over(){S.over=true;S.streak=0;drawPlay();$("#mn").setAttribute("class","mn fail");$("#mt").textContent="timed out";const w=$("#win");w.className="show";w.innerHTML=`<h4>Time's up</h4><p class="mu" style="margin:0">The merge window closed before CI went green.</p><p style="margin:8px 0 0"><strong>Why:</strong> ${E(WHY[S.i])}</p><p style="margin:10px 0 0"><button data-go="${S.i}">Retry level</button></p>`}
setInterval(()=>{if(V!=="play"||S.over||S.done)return;S.left=Math.max(0,S.left-.25);hud();if(S.left<=0)over()},250);
document.addEventListener("click",e=>{const b=e.target.closest("button,code[data-an]");if(!b)return;const d=b.dataset;
 if(d.v){V=d.v;S.wipe=0;render()}
 else if(d.go!==undefined){load(+d.go);V="play";render()}
 else if(d.an!==undefined){AI=+d.an;render()}
 else if(d.ck!==undefined){CKD[d.ck]=!CKD[d.ck];render()}
 else if(b.id==="wipe"){if(S.wipe){P=[];SC=[];save();try{localStorage.removeItem(KEY+"-sc")}catch(e){}S.wipe=0}else S.wipe=1;render()}
 else if(d.f!==undefined){S.f=+d.f;drawPlay()}
 else if(d.md){S.md=d.md;drawPlay()}
 else if(d.m){S.files[S.f]=take(S.files[S.f],+d.k,d.m);S.armed=false;drawPlay()}
 else if(b.id==="run")run();
 else if(b.id==="hint"){if(!S.hint&&!S.hinted){S.hinted=true;S.hp++}S.hint=!S.hint;drawPlay()}
 else if(b.id==="reset"){if(S.armed){S.files=LV[S.i].files.map(x=>x[1]);S.f=0;S.armed=false;drawPlay()}else{S.armed=true;drawPlay()}}});
document.addEventListener("input",e=>{if(e.target.id==="ed"){S.files[S.f]=e.target.value;S.armed=false;$("#tabs").innerHTML=LV[S.i].files.map((f,i)=>{const n=parse(S.files[i]).H.length;return`<button data-f="${i}" class="${i===S.f?"on":""}">${f[0]}${n?`<i>${n}</i>`:""}</button>`}).join("")}});
document.addEventListener("keydown",e=>{if(V==="play"&&e.ctrlKey&&e.key==="Enter"){e.preventDefault();run()}});
load(0);render();
</script>
</body>
