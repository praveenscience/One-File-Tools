<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regex Golf: The Gauntlet — One File Tools</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        /* ========================================
         Reset & Variables
         ======================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #080c14;
        --surface: #0d1117;
        --surface-2: #161b22;
        --border: #21262d;
        --amber: #ffaa00;
        --amber-dim: rgba(255, 170, 0, 0.12);
        --amber-glow: rgba(255, 170, 0, 0.4);
        --cyan: #00ccff;
        --cyan-dim: rgba(0, 204, 255, 0.12);
        --green: #00ff88;
        --green-dim: rgba(0, 255, 136, 0.12);
        --pink: #ff3366;
        --pink-dim: rgba(255, 51, 102, 0.12);
        --gold: #ffd700;
        --text: #e6edf3;
        --text-dim: #7d8590;
        --font: "Space Mono", monospace;
        --syn-str: #a5d6a7;
        --syn-kw: #c792ea;
        --syn-fn: #ffcb6b;
        --syn-num: #f78c6c;
        --syn-cmt: #546e7a;
      }

      /* ========================================
         Layout
         ======================================== */
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.5rem;
        background-image: radial-gradient(circle at 50% 0%, rgba(255, 170, 0, 0.03) 0%, transparent 50%);
      }

      .container {
        width: 100%;
        max-width: 720px;
      }

      /* ========================================
         Buttons
         ======================================== */
      .btn {
        display: inline-block;
        font-family: var(--font);
        font-size: 0.9rem;
        font-weight: 700;
        padding: 0.65rem 2rem;
        border: 2px solid var(--amber);
        color: var(--amber);
        background: transparent;
        border-radius: 6px;
        cursor: pointer;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: all 0.2s;
      }

      .btn:hover:not(:disabled) {
        background: var(--amber);
        color: var(--bg);
        box-shadow: 0 0 20px var(--amber-glow);
      }

      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .btn-small {
        font-size: 0.75rem;
        padding: 0.45rem 1rem;
      }

      .btn-ghost {
        border-color: var(--border);
        color: var(--text-dim);
      }

      .btn-ghost:hover:not(:disabled) {
        border-color: var(--text-dim);
        color: var(--text);
        background: var(--surface-2);
        box-shadow: none;
      }

      /* ========================================
         Title Screen
         ======================================== */
      .title-screen {
        text-align: center;
        padding: 3rem 1rem;
        animation: fadeIn 0.5s ease;
      }

      .title-screen h1 {
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--amber);
        text-shadow: 0 0 30px var(--amber-glow);
        letter-spacing: 3px;
        margin-bottom: 0.5rem;
      }

      .title-screen .subtitle {
        color: var(--text-dim);
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
      }

      .title-screen .tagline {
        color: var(--cyan);
        font-size: 0.8rem;
        margin-bottom: 2rem;
        opacity: 0.8;
      }

      .title-screen .how-to {
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem 1.5rem;
        margin-bottom: 2rem;
        font-size: 0.8rem;
        line-height: 1.8;
        color: var(--text-dim);
      }

      .title-screen .how-to h3 {
        color: var(--text);
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
      }

      .title-screen .how-to .hl {
        color: var(--amber);
      }

      .title-actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      /* rounds preview on title screen */
      .rounds-preview {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.6rem;
        margin-bottom: 2rem;
      }

      .round-chip {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 8px;
        padding: 0.6rem 0.4rem;
        font-size: 0.65rem;
        line-height: 1.5;
      }

      .round-chip .rc-num {
        color: var(--amber);
        font-weight: 700;
        display: block;
        margin-bottom: 0.2rem;
      }

      .round-chip .rc-name {
        color: var(--text);
        display: block;
      }

      /* ========================================
         Game Screen
         ======================================== */
      .game-screen {
        animation: fadeIn 0.35s ease;
      }

      .game-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
      }

      .level-badge {
        font-size: 0.75rem;
        color: var(--amber);
        border: 1px solid rgba(255, 170, 0, 0.3);
        padding: 0.2rem 0.6rem;
        border-radius: 4px;
        background: var(--amber-dim);
        white-space: nowrap;
      }

      .level-name {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .level-desc {
        color: var(--text-dim);
        font-size: 0.8rem;
        margin-bottom: 1.25rem;
      }

      /* ========================================
         Stats Bar
         ======================================== */
      .stats-bar {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 1rem;
        font-size: 0.78rem;
        color: var(--text-dim);
        flex-wrap: wrap;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 8px;
        padding: 0.7rem 1rem;
      }

      .stats-bar strong {
        color: var(--text);
        font-size: 0.95rem;
      }

      .stats-bar .lives strong {
        color: var(--pink);
      }

      .stats-bar .lives.infinite strong {
        color: var(--cyan);
      }

      .stats-bar .stat-label {
        display: block;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.62rem;
        margin-bottom: 0.15rem;
      }

      /* ========================================
         Regex Input Row
         ======================================== */
      .regex-row {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 1.25rem;
      }

      .regex-row input {
        flex: 1;
        font-family: var(--font);
        font-size: 0.95rem;
        background: var(--surface);
        border: 2px solid var(--border);
        color: var(--text);
        padding: 0.65rem 0.9rem;
        border-radius: 6px;
        outline: none;
        transition: border-color 0.2s;
      }

      .regex-row input:focus {
        border-color: var(--amber);
      }

      .regex-row input.invalid-syntax {
        border-color: var(--pink);
      }

      .stroke-count {
        font-size: 0.72rem;
        color: var(--text-dim);
        margin-bottom: 1rem;
        text-align: right;
      }

      .stroke-count strong {
        color: var(--cyan);
      }

      /* ========================================
         Match / Reject Columns
         ======================================== */
      .match-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      .match-col h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 0.5rem;
      }

      .match-col.green h2 {
        color: var(--green);
      }

      .match-col.red h2 {
        color: var(--pink);
      }

      .match-col ul {
        list-style: none;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 8px;
        overflow: hidden;
      }

      .match-col li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0.75rem;
        font-size: 0.85rem;
        border-bottom: 1px solid var(--border);
      }

      .match-col li:last-child {
        border-bottom: none;
      }

      .match-col .status {
        font-size: 0.95rem;
      }

      .match-col .status.pending {
        color: var(--text-dim);
      }

      .match-col .status.ok {
        color: var(--green);
      }

      .match-col .status.bad {
        color: var(--pink);
      }

      @media (max-width: 480px) {
        .match-cols {
          grid-template-columns: 1fr;
        }
        .rounds-preview {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* ========================================
         Console Output
         ======================================== */
      .console-area {
        background: #030508;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 1.25rem;
      }

      .console-header {
        padding: 0.45rem 1rem;
        font-size: 0.7rem;
        color: var(--text-dim);
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .console-body {
        padding: 0.75rem 1rem;
        min-height: 42px;
        font-size: 0.85rem;
        line-height: 1.8;
      }

      .console-line {
        animation: fadeIn 0.2s ease;
        color: var(--text-dim);
      }

      .console-line::before {
        content: "> ";
        color: var(--text-dim);
      }

      .console-line.ok { color: var(--green); }
      .console-line.warn { color: var(--pink); }
      .console-line.info { color: var(--cyan); }

      /* ========================================
         Grade Badge
         ======================================== */
      .grade-badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 0.2rem 0.6rem;
        border-radius: 4px;
        border: 1px solid;
      }

      .grade-badge.eagle,
      .grade-badge.birdie {
        color: var(--gold);
        border-color: rgba(255, 215, 0, 0.4);
        background: rgba(255, 215, 0, 0.1);
      }

      .grade-badge.par {
        color: var(--cyan);
        border-color: rgba(0, 204, 255, 0.3);
        background: var(--cyan-dim);
      }

      .grade-badge.bogey,
      .grade-badge.double-bogey {
        color: var(--pink);
        border-color: rgba(255, 51, 102, 0.3);
        background: var(--pink-dim);
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      /* ========================================
         Progress Bar
         ======================================== */
      .progress-bar {
        margin-top: 1.5rem;
      }

      .progress-track {
        height: 4px;
        background: var(--surface-2);
        border-radius: 2px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--amber), var(--cyan));
        border-radius: 2px;
        transition: width 0.5s ease;
      }

      .progress-label {
        display: flex;
        justify-content: space-between;
        margin-top: 0.4rem;
        font-size: 0.7rem;
        color: var(--text-dim);
      }

      /* ========================================
         Round Complete / Round Intro
         ======================================== */
      .level-complete {
        text-align: center;
        padding: 2rem 0.5rem;
        animation: fadeIn 0.4s ease;
      }

      .result-stars {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
        display: flex;
        justify-content: center;
        gap: 6px;
      }

      .result-label {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .result-label.perfect { color: var(--gold); }
      .result-label.great { color: var(--green); }
      .result-label.good { color: var(--cyan); }
      .result-label.bad { color: var(--pink); }

      .concept-box {
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--amber);
        border-radius: 6px;
        padding: 1rem 1.25rem;
        margin: 1.5rem 0;
        font-size: 0.82rem;
        line-height: 1.7;
        color: var(--text-dim);
      }

      .concept-box strong {
        color: var(--amber);
      }

      .concept-box .concept-title {
        color: var(--text);
        font-weight: 700;
        margin-bottom: 0.4rem;
        font-size: 0.85rem;
      }

      .level-complete .actions {
        justify-content: center;
      }

      /* ========================================
         Scorecard
         ======================================== */
      .scorecard {
        text-align: center;
        padding: 1rem 0;
        animation: fadeIn 0.5s ease;
      }

      .scorecard h2 {
        font-size: 1.6rem;
        color: var(--amber);
        text-shadow: 0 0 20px var(--amber-glow);
        margin-bottom: 0.5rem;
      }

      .scorecard .total-stars {
        font-size: 1.3rem;
        margin-bottom: 1.5rem;
        color: var(--text-dim);
      }

      .sc-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5rem;
        font-size: 0.78rem;
      }

      .sc-table th {
        padding: 0.5rem;
        border-bottom: 2px solid var(--border);
        color: var(--text-dim);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.68rem;
      }

      .sc-table td {
        padding: 0.45rem 0.5rem;
        border-bottom: 1px solid var(--border);
        text-align: center;
      }

      .sc-table td:first-child { text-align: left; }

      .sc-table .lvl-num { color: var(--amber); }
      .sc-table .perfect-score { color: var(--gold); }
      .sc-table .ok-score { color: var(--cyan); }
      .sc-table .bad-score { color: var(--pink); }

      .scorecard .actions {
        justify-content: center;
      }

      /* ========================================
         Footer & Animations
         ======================================== */
      footer {
        margin-top: auto;
        padding-top: 2rem;
        text-align: center;
        font-size: 0.72rem;
        color: var(--text-dim);
      }

      footer a {
        color: var(--cyan);
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }

      .shake { animation: shake 0.4s ease; }

      .confetti-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1000;
        overflow: hidden;
      }

      .confetti-piece {
        position: absolute;
        top: -10px;
        animation: confettiFall linear forwards;
      }

      @keyframes confettiFall {
        0% { opacity: 1; transform: translateY(0) rotate(0deg); }
        100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
      }
    </style>
</head>

<body>
  <div class="container">
    <div id="app"></div>
    <footer>
      Regex Golf: The Gauntlet — every hole is judged live by JavaScript's own <code>RegExp</code> engine.
      <br />Press <span class="hl" style="color:var(--amber)">Enter</span> to submit a hole.
    </footer>
  </div>
  <div class="confetti-container" id="confetti"></div>

  <script>
    /* ========================================================
       DATA — 16 holes across 4 rounds.
       Each hole's par is the length of a regex that was verified
       (via Node's real RegExp engine) to match every green string
       and reject every red string. Players never see the pattern —
       only the par they're trying to beat.
       ======================================================== */
    const ROUNDS = [
      {
        key: 1,
        name: "Driving Range",
        tagline: "Any working regex clears the hole. No pressure — just learn the shapes.",
        lives: Infinity,
        rule: "free",
        concept: {
          title: "Concept: Literal Substrings",
          body: "If a chunk of text shows up in every green string and in none of the red ones, that chunk alone is a valid regex — no anchors, no character classes, no metacharacters required. Before reaching for anything fancy, always check whether the plain text already does the job."
        }
      },
      {
        key: 2,
        name: "The Back Nine",
        tagline: "Every hole must be cleared. Shoot over par and it costs you a life.",
        lives: 3,
        rule: "par",
        concept: {
          title: "Concept: Anchors, Classes & Quantifiers",
          body: "^ and $ pin a pattern to the start or end of a string. [0-9] and (.) describe a shape rather than exact characters. {n} repeats a group exactly n times. Together they let you describe the structure of a match instead of spelling it out letter by letter — usually far fewer strokes."
        }
      },
      {
        key: 3,
        name: "Championship Course",
        tagline: "Two lives left. Precision now matters more than ever.",
        lives: 2,
        rule: "par",
        concept: {
          title: "Concept: Boundaries, Optionality & Repetition Ranges",
          body: "\\b matches a word edge without consuming a character, so it separates 'cat' from 'concatenate'. ? makes the character before it optional. {n,} means 'n or more'. These let you say exactly what you mean at the edges of a match, which is usually shorter than a broader pattern plus extra filtering."
        }
      },
      {
        key: 4,
        name: "Bogey-Free Gauntlet",
        tagline: "One life. One shot at each hole. No bogeys allowed.",
        lives: 1,
        rule: "par",
        concept: {
          title: "Concept: Negated Classes",
          body: "[^abc] matches any character except the ones listed. Saying what's forbidden is often dramatically shorter than enumerating everything that's allowed — the last, sharpest tool in a regex golfer's bag."
        }
      }
    ];

    const HOLES = [
      // ROUND 1 — Driving Range
      { round: 1, name: "Warm-Up", hint: "Every match shares a substring the rejects never contain.",
        green: ["cat", "car", "cap", "cab"], red: ["dog", "bat", "map", "cot"], par: 2 },
      { round: 1, name: "Endings", hint: "Look at what the matches end with.",
        green: ["red", "bed", "fed", "led"], red: ["read", "beard", "deer", "free"], par: 2 },
      { round: 1, name: "Digits", hint: "One list contains a character type the other never does.",
        green: ["a1", "b2", "c3", "z9"], red: ["ab", "xy", "zz", "qq"], par: 5 },
      { round: 1, name: "Vowel Start", hint: "Check how each match begins.",
        green: ["apple", "egg", "igloo", "owl"], red: ["pear", "fig", "kiwi", "cot"], par: 8 },

      // ROUND 2 — The Back Nine
      { round: 2, name: "Three Letters", hint: "Length is the entire rule here — nothing else.",
        green: ["dog", "cat", "sun", "top"], red: ["dogs", "at", "sunny", "tops"], par: 5 },
      { round: 2, name: "Double Letters", hint: "Somewhere in every match, a letter repeats itself immediately.",
        green: ["moon", "tree", "book", "seen"], red: ["moan", "tray", "bake", "sane"], par: 5 },
      { round: 2, name: "Phone-ish", hint: "Digits, a dash, more digits — and nothing extra allowed.",
        green: ["123-4567", "000-0000", "999-1111"], red: ["1234567", "abc-defg", "12-3456"], par: 19 },
      { round: 2, name: "Either / Or", hint: "Only two exact words are allowed through, nothing else.",
        green: ["cat", "dog"], red: ["bat", "fog", "cot", "dot"], par: 11 },

      // ROUND 3 — Championship Course
      { round: 3, name: "Word Boundary", hint: "Match the whole word, not any word that merely contains it.",
        green: ["I like cats", "cats are cute"], red: ["scattered", "concatenate"], par: 8 },
      { round: 3, name: "Optional Char", hint: "One spelling has a letter the other doesn't.",
        green: ["color", "colour"], red: ["collar", "colonel"], par: 7 },
      { round: 3, name: "Repeats", hint: "Matches need at least three of the same character in a row.",
        green: ["aaa", "aaaa", "aaaaa"], red: ["a", "aa", "b"], par: 5 },
      { round: 3, name: "Hex Code", hint: "A # followed by either 3 or 6 hex digits, and nothing more.",
        green: ["#fff", "#a1b2c3", "#000000"], red: ["#gg0", "fff", "#12"], par: 28 },

      // ROUND 4 — Bogey-Free Gauntlet
      { round: 4, name: "Email-ish", hint: "Something, an @, something, a dot, something — no spaces anywhere.",
        green: ["a@b.com", "x.y@z.io"], red: ["a@b", "@b.com", "a@.com"], par: 14 },
      { round: 4, name: "Not This", hint: "Four letters starting with 'foo' — and only exactly four.",
        green: ["food", "fool", "foot"], red: ["foo", "fool!"], par: 6 },
      { round: 4, name: "Anchors Both", hint: "One or more full repeats of a whole word, nothing else in the string.",
        green: ["yes", "yesyes"], red: ["yesno", "noyes", "yeah"], par: 8 },
      { round: 4, name: "Negated Class", hint: "Everything is allowed in the middle except three specific letters.",
        green: ["cat", "cot", "cut"], red: ["cet", "cit", "cbt"], par: 8 }
    ];

    /* ========================================================
       STATE
       ======================================================== */
    let state = {
      screen: "title",   // title | round-intro | game | round-complete | game-over | scorecard
      holeIdx: 0,
      lives: 0,
      results: []         // { holeIdx, strokes, par, grade }
    };

    const app = document.getElementById("app");

    function currentHole() { return HOLES[state.holeIdx]; }
    function currentRound() { return ROUNDS[currentHole().round - 1]; }
    function holesInRound(roundKey) { return HOLES.filter(h => h.round === roundKey); }
    function holeNumberInRound() {
      const list = holesInRound(currentHole().round);
      return list.indexOf(currentHole()) + 1;
    }

    function grade(strokes, par) {
      const diff = strokes - par;
      if (diff <= -2) return { label: "Eagle", cls: "eagle", scoreCls: "perfect-score" };
      if (diff === -1) return { label: "Birdie", cls: "birdie", scoreCls: "perfect-score" };
      if (diff === 0) return { label: "Par", cls: "par", scoreCls: "ok-score" };
      if (diff <= 2) return { label: "Bogey", cls: "bogey", scoreCls: "bad-score" };
      return { label: "Double Bogey", cls: "double-bogey", scoreCls: "bad-score" };
    }

    function resetGame() {
      state = { screen: "title", holeIdx: 0, lives: 0, results: [] };
      render();
    }

    function startRound() {
      state.lives = currentRound().lives;
      state.screen = "game";
      render();
    }

    function fireConfetti(count) {
      const box = document.getElementById("confetti");
      const colors = ["#ffaa00", "#00ccff", "#00ff88", "#ff3366", "#ffd700"];
      for (let i = 0; i < count; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.width = piece.style.height = 6 + Math.random() * 6 + "px";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        piece.style.animationDuration = 1.6 + Math.random() * 1.4 + "s";
        piece.style.animationDelay = Math.random() * 0.3 + "s";
        box.appendChild(piece);
        setTimeout(() => piece.remove(), 3200);
      }
    }

    /* ========================================================
       RENDER — TITLE
       ======================================================== */
    function renderTitle() {
      app.innerHTML = `
        <div class="title-screen">
          <h1>REGEX GOLF</h1>
          <div class="subtitle">THE GAUNTLET</div>
          <div class="tagline">Write the shortest regex that clears every hole.</div>

          <div class="how-to">
            <h3>How it works</h3>
            Every hole gives you two lists: strings you must <span class="hl">match</span> (green) and strings you must <span class="hl">reject</span> (red). Write one regular expression that does both.
            <br /><br />
            Matching is only the entry fee. Your score is the <span class="hl">length</span> of your pattern against the hole's <span class="hl">par</span> — fewer characters is better, just like golf.
            <br /><br />
            Nothing is hand-graded: your pattern is compiled with the real <span class="hl">RegExp</span> engine and tested against every string live.
          </div>

          <div class="rounds-preview">
            ${ROUNDS.map(r => `
              <div class="round-chip">
                <span class="rc-num">R${r.key}</span>
                <span class="rc-name">${r.name}</span>
              </div>
            `).join("")}
          </div>

          <div class="title-actions">
            <button class="btn" id="teeOffBtn">⛳ Tee Off</button>
          </div>
        </div>
      `;
      document.getElementById("teeOffBtn").addEventListener("click", () => {
        state.holeIdx = 0;
        state.screen = "round-intro";
        render();
      });
    }

    /* ========================================================
       RENDER — ROUND INTRO
       ======================================================== */
    function renderRoundIntro() {
      const round = currentRound();
      const total = holesInRound(round.key).length;
      const livesLabel = round.lives === Infinity ? "∞ (unlimited)" : "❤️".repeat(round.lives);
      app.innerHTML = `
        <div class="title-screen">
          <div class="level-badge">ROUND ${round.key} OF ${ROUNDS.length}</div>
          <h1 style="font-size:1.8rem; margin-top:0.75rem;">${round.name}</h1>
          <div class="tagline">${round.tagline}</div>
          <div class="how-to" style="text-align:center;">
            <strong style="color:var(--text)">${total} holes</strong> ahead &nbsp;•&nbsp;
            Lives: <strong style="color:var(--pink)">${livesLabel}</strong>
          </div>
          <div class="title-actions">
            <button class="btn" id="startRoundBtn">Start Round</button>
          </div>
        </div>
      `;
      document.getElementById("startRoundBtn").addEventListener("click", startRound);
    }

    /* ========================================================
       RENDER — GAME (a hole)
       ======================================================== */
    function renderGame() {
      const hole = currentHole();
      const round = currentRound();
      const totalInRound = holesInRound(round.key).length;
      const livesDisplay = round.lives === Infinity ? "∞" : "❤️".repeat(Math.max(state.lives, 0));
      const overallStrokes = state.results.reduce((s, r) => s + r.strokes, 0);
      const overallPar = state.results.reduce((s, r) => s + r.par, 0);
      const diff = overallStrokes - overallPar;
      const diffLabel = state.results.length === 0 ? "E" : (diff === 0 ? "E" : (diff > 0 ? "+" + diff : diff));

      app.innerHTML = `
        <div class="game-screen">
          <div class="game-header">
            <span class="level-badge">ROUND ${round.key} · HOLE ${holeNumberInRound()}/${totalInRound}</span>
            <span class="level-name">${hole.name}</span>
          </div>
          <div class="level-desc">${hole.hint}</div>

          <div class="stats-bar">
            <div><span class="stat-label">Par</span><strong>${hole.par}</strong></div>
            <div><span class="stat-label">Strokes</span><strong id="strokeLive">0</strong></div>
            <div class="lives ${round.lives === Infinity ? "infinite" : ""}"><span class="stat-label">Lives</span><strong>${livesDisplay}</strong></div>
            <div><span class="stat-label">Score</span><strong>${diffLabel}</strong></div>
          </div>

          <div class="regex-row">
            <input type="text" id="regexInput" placeholder="Example: ^a.*z$" autocomplete="off" autocapitalize="off" spellcheck="false" />
            <button class="btn btn-small" id="submitBtn">Lock In</button>
          </div>
          <div class="stroke-count">Current length: <strong id="strokeCount">0</strong> chars</div>

          <div class="match-cols">
            <div class="match-col green">
              <h2>✓ Must Match</h2>
              <ul id="greenList"></ul>
            </div>
            <div class="match-col red">
              <h2>✕ Must Reject</h2>
              <ul id="redList"></ul>
            </div>
          </div>

          <div class="console-area">
            <div class="console-header">Result</div>
            <div class="console-body" id="consoleBody">
              <div class="console-line">Type a regex to begin.</div>
            </div>
          </div>

          <div class="progress-bar">
            <div class="progress-track"><div class="progress-fill" style="width:${(state.holeIdx / HOLES.length) * 100}%"></div></div>
            <div class="progress-label"><span>Hole ${state.holeIdx + 1} of ${HOLES.length}</span><span>${Math.round((state.holeIdx / HOLES.length) * 100)}%</span></div>
          </div>
        </div>
      `;

      const greenList = document.getElementById("greenList");
      const redList = document.getElementById("redList");
      hole.green.forEach(w => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${w}</span><span class="status pending">⏳</span>`;
        greenList.appendChild(li);
      });
      hole.red.forEach(w => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${w}</span><span class="status pending">⏳</span>`;
        redList.appendChild(li);
      });

      const input = document.getElementById("regexInput");
      const submitBtn = document.getElementById("submitBtn");
      const strokeCount = document.getElementById("strokeCount");
      const strokeLive = document.getElementById("strokeLive");
      const consoleBody = document.getElementById("consoleBody");

      input.focus();

      function liveCheck() {
        const pattern = input.value;
        strokeCount.textContent = pattern.length;
        strokeLive.textContent = pattern.length;

        let re = null;
        let validSyntax = true;
        if (pattern.length > 0) {
          try { re = new RegExp(pattern); }
          catch (e) { validSyntax = false; }
        }
        input.classList.toggle("invalid-syntax", !validSyntax);

        const greenItems = greenList.querySelectorAll("li .status");
        hole.green.forEach((w, i) => {
          const el = greenItems[i];
          if (!re) { el.textContent = "⏳"; el.className = "status pending"; return; }
          const ok = re.test(w);
          el.textContent = ok ? "✓" : "✕";
          el.className = "status " + (ok ? "ok" : "bad");
        });

        const redItems = redList.querySelectorAll("li .status");
        hole.red.forEach((w, i) => {
          const el = redItems[i];
          if (!re) { el.textContent = "⏳"; el.className = "status pending"; return; }
          const bad = re.test(w);
          el.textContent = bad ? "✕" : "✓";
          el.className = "status " + (bad ? "bad" : "ok");
        });
      }

      input.addEventListener("input", liveCheck);
      input.addEventListener("keydown", e => { if (e.key === "Enter") submitHole(); });
      submitBtn.addEventListener("click", submitHole);

      function logLine(text, cls) {
        const line = document.createElement("div");
        line.className = "console-line " + (cls || "");
        line.textContent = text;
        consoleBody.innerHTML = "";
        consoleBody.appendChild(line);
      }

      function submitHole() {
        const pattern = input.value.trim();
        if (pattern === "") {
          logLine("Enter a regex first.", "warn");
          input.classList.add("shake");
          setTimeout(() => input.classList.remove("shake"), 400);
          return;
        }

        let re;
        try { re = new RegExp(pattern); }
        catch (e) {
          logLine("Invalid regular expression — fix the syntax and try again.", "warn");
          input.classList.add("shake");
          setTimeout(() => input.classList.remove("shake"), 400);
          return;
        }

        const greenOk = hole.green.every(w => re.test(w));
        const redOk = hole.red.every(w => !re.test(w));

        if (!greenOk || !redOk) {
          logLine("Not solved yet — check the ✕ marks above.", "warn");
          input.classList.add("shake");
          setTimeout(() => input.classList.remove("shake"), 400);
          return;
        }

        // Hole cleared
        const strokes = pattern.length;
        const g = grade(strokes, hole.par);
        state.results.push({ holeIdx: state.holeIdx, strokes, par: hole.par, grade: g });

        const isBogeyOrWorse = strokes > hole.par;
        let lifeLost = false;
        if (round.rule === "par" && isBogeyOrWorse) {
          state.lives -= 1;
          lifeLost = true;
        }

        if (g.cls === "eagle" || g.cls === "birdie") fireConfetti(40);

        logLine(`Cleared! ${strokes} chars vs par ${hole.par} — ${g.label}${lifeLost ? " (a life was lost)" : ""}`, isBogeyOrWorse ? "warn" : "ok");

        submitBtn.disabled = true;
        input.disabled = true;

        setTimeout(() => {
          if (round.rule === "par" && state.lives <= 0) {
            state.screen = "game-over";
            render();
            return;
          }
          advanceHole();
        }, 900);
      }
    }

    function advanceHole() {
      const round = currentRound();
      const isLastInRound = holeNumberInRound() === holesInRound(round.key).length;

      if (isLastInRound) {
        state.screen = "round-complete";
        render();
        return;
      }

      state.holeIdx += 1;
      state.screen = "game";
      render();
    }

    /* ========================================================
       RENDER — ROUND COMPLETE
       ======================================================== */
    function renderRoundComplete() {
      const round = currentRound();
      const roundResults = state.results.filter(r => HOLES[r.holeIdx].round === round.key);
      const birdieOrBetter = roundResults.filter(r => r.grade.cls === "eagle" || r.grade.cls === "birdie").length;
      const stars = Math.min(3, Math.max(1, Math.round((birdieOrBetter / roundResults.length) * 3) || 2));
      const isFinalRound = round.key === ROUNDS.length;

      app.innerHTML = `
        <div class="level-complete">
          <div class="result-stars">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</div>
          <div class="result-label good">${round.name} Complete</div>
          <div class="level-desc">
            ${roundResults.map(r => grade(r.strokes, r.par).label).join(" · ")}
          </div>
          <div class="concept-box">
            <div class="concept-title">${round.concept.title}</div>
            ${round.concept.body}
          </div>
          <div class="actions">
            <button class="btn" id="continueBtn">${isFinalRound ? "View Final Scorecard" : "Continue to Round " + (round.key + 1)}</button>
          </div>
        </div>
      `;

      document.getElementById("continueBtn").addEventListener("click", () => {
        if (isFinalRound) {
          state.screen = "scorecard";
          fireConfetti(80);
        } else {
          state.holeIdx += 1;
          state.screen = "round-intro";
        }
        render();
      });
    }

    /* ========================================================
       RENDER — GAME OVER
       ======================================================== */
    function renderGameOver() {
      const round = currentRound();
      app.innerHTML = `
        <div class="level-complete">
          <div class="result-stars">💀</div>
          <div class="result-label bad">Game Over</div>
          <div class="level-desc">You ran out of lives in ${round.name} — bogeying too many holes caught up with you.</div>
          <div class="concept-box">
            <div class="concept-title">Holes cleared this run</div>
            ${state.results.length} of ${HOLES.length}, averaging ${
              state.results.length ? (state.results.reduce((s, r) => s + (r.strokes - r.par), 0) / state.results.length).toFixed(1) : "0"
            } strokes over par.
          </div>
          <div class="actions">
            <button class="btn" id="retryBtn">Play Again</button>
          </div>
        </div>
      `;
      document.getElementById("retryBtn").addEventListener("click", resetGame);
    }

    /* ========================================================
       RENDER — SCORECARD
       ======================================================== */
    function renderScorecard() {
      const totalStrokes = state.results.reduce((s, r) => s + r.strokes, 0);
      const totalPar = state.results.reduce((s, r) => s + r.par, 0);
      const diff = totalStrokes - totalPar;
      const diffLabel = diff === 0 ? "Even Par" : (diff < 0 ? diff + " Under Par" : "+" + diff + " Over Par");
      const eagles = state.results.filter(r => r.grade.cls === "eagle").length;
      const birdies = state.results.filter(r => r.grade.cls === "birdie").length;
      const totalStars = Math.min(5, Math.max(1, Math.round(((eagles * 2 + birdies) / state.results.length) * 5) || 3));

      app.innerHTML = `
        <div class="scorecard">
          <h2>🏆 Course Complete</h2>
          <div class="total-stars">${"★".repeat(totalStars)}${"☆".repeat(5 - totalStars)}</div>
          <div class="level-desc" style="text-align:center; margin-bottom:1.5rem;">
            ${totalStrokes} strokes across ${state.results.length} holes — <strong style="color:var(--text)">${diffLabel}</strong>
          </div>
          <table class="sc-table">
            <thead>
              <tr><th>Hole</th><th>Round</th><th>Par</th><th>Strokes</th><th>Result</th></tr>
            </thead>
            <tbody>
              ${state.results.map(r => {
                const h = HOLES[r.holeIdx];
                const g = r.grade;
                return `<tr>
                  <td class="lvl-num">${h.name}</td>
                  <td>${r.holeIdx !== undefined ? h.round : ""}</td>
                  <td>${r.par}</td>
                  <td>${r.strokes}</td>
                  <td class="${g.scoreCls}">${g.label}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
          <div class="actions">
            <button class="btn" id="playAgainBtn">Play Again</button>
          </div>
        </div>
      `;
      document.getElementById("playAgainBtn").addEventListener("click", resetGame);
    }

    /* ========================================================
       ROUTER
       ======================================================== */
    function render() {
      switch (state.screen) {
        case "title": return renderTitle();
        case "round-intro": return renderRoundIntro();
        case "game": return renderGame();
        case "round-complete": return renderRoundComplete();
        case "game-over": return renderGameOver();
        case "scorecard": return renderScorecard();
        default: return renderTitle();
      }
    }

    render();
  </script>
</body>
</html>
