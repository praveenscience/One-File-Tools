<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary & Hexadecimal Switchboard Trainer — One File Tools</title>
    <script>
      (function () {
        var t = localStorage.getItem("binhex_theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-primary: #090e17;
        --bg-secondary: #121a29;
        --bg-tertiary: #1c273c;
        --border-color: #293852;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-cyan: #06b6d4;
        --accent-amber: #f59e0b;
        --accent-emerald: #10b981;
        --accent-indigo: #6366f1;
        --font-sans: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --font-heading: "Oxanium", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --bg-primary: #f8fafc;
          --bg-secondary: #ffffff;
          --bg-tertiary: #f1f5f9;
          --border-color: #cbd5e1;
          --text-primary: #0f172a;
          --text-secondary: #475569;
          --accent-cyan: #0891b2;
          --accent-amber: #d97706;
          --accent-emerald: #059669;
          --accent-indigo: #4f46e5;
        }
      }

      [data-theme="dark"] {
        --bg-primary: #090e17;
        --bg-secondary: #121a29;
        --bg-tertiary: #1c273c;
        --border-color: #293852;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-cyan: #06b6d4;
        --accent-amber: #f59e0b;
        --accent-emerald: #10b981;
        --accent-indigo: #6366f1;
      }

      [data-theme="light"] {
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f1f5f9;
        --border-color: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --accent-cyan: #0891b2;
        --accent-amber: #d97706;
        --accent-emerald: #059669;
        --accent-indigo: #4f46e5;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        transition:
          background-color 0.2s,
          color 0.2s;
      }

      header {
        background-color: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .logo-group h1 {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .logo-group p {
        color: var(--text-secondary);
        font-size: 0.8125rem;
      }

      .stats-bar {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .stat-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-family: var(--font-heading);
        font-size: 1.125rem;
        font-weight: 700;
      }

      .theme-btn {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.45rem 0.85rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.8125rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        transition: all 0.2s;
      }

      .theme-btn:hover {
        border-color: var(--accent-cyan);
      }

      main {
        max-width: 950px;
        width: 100%;
        margin: 2rem auto;
        padding: 0 1.5rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .mission-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      .target-display {
        background: #060911;
        border: 2px solid #1a253a;
        border-radius: 14px;
        padding: 1.75rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .target-label {
        font-size: 0.8125rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent-amber);
      }

      .target-value {
        font-family: var(--font-mono);
        font-size: 2.75rem;
        font-weight: 800;
        color: var(--accent-cyan);
        letter-spacing: 0.05em;
      }

      .switchboard {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 0.75rem;
      }

      .bit-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
      }

      .bit-weight {
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 700;
        color: var(--text-secondary);
      }

      .bit-switch {
        background: var(--bg-tertiary);
        border: 2px solid var(--border-color);
        color: var(--text-secondary);
        width: 100%;
        height: 75px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-size: 1.5rem;
        font-weight: 800;
        transition: all 0.15s ease;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      .bit-switch:hover {
        border-color: var(--accent-cyan);
        transform: translateY(-2px);
      }

      .bit-switch.on {
        background: var(--accent-cyan);
        color: #000;
        border-color: var(--accent-cyan);
        box-shadow: 0 0 16px rgba(6, 182, 212, 0.4);
      }

      .readout-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.25rem;
        text-align: center;
      }

      .readout-item {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .readout-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
      }

      .readout-val {
        font-family: var(--font-mono);
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .btn {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.65rem 1.25rem;
        border-radius: 8px;
        font-family: var(--font-heading);
        font-size: 0.9375rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        transition: all 0.2s;
      }

      .btn:hover {
        border-color: var(--accent-cyan);
      }

      .btn.primary {
        background: var(--accent-cyan);
        color: #000;
        border-color: var(--accent-cyan);
      }

      .mode-chips {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .mode-chip {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        font-size: 0.8125rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }

      .mode-chip.active {
        background: var(--accent-indigo);
        color: #fff;
        border-color: var(--accent-indigo);
      }

      footer {
        background-color: var(--bg-secondary);
        border-top: 1px solid var(--border-color);
        padding: 1.5rem;
        text-align: center;
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      footer a {
        color: var(--accent-cyan);
        text-decoration: none;
        font-weight: 600;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 650px) {
        .switchboard {
          grid-template-columns: repeat(4, 1fr);
        }
        .readout-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-group">
        <h1>🕹️ Binary & Hex Switchboard</h1>
        <p>Interactive Bitwise Trainer: Master powers of 2 and hexadecimal nibbles</p>
      </div>
      <div class="stats-bar">
        <div class="stat-item" style="color: var(--accent-amber)">⭐ <span id="scoreDisplay">0</span></div>
        <div class="stat-item" style="color: var(--accent-emerald)">🔥 <span id="streakDisplay">0</span></div>
        <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </header>

    <main>
      <div class="mission-card">
        <div class="controls-row">
          <div class="mode-chips">
            <button class="mode-chip active" data-mode="decimal">Match Decimal</button>
            <button class="mode-chip" data-mode="hex">Match Hex (0x..)</button>
            <button class="mode-chip" data-mode="free">Free Practice</button>
          </div>
          <button id="resetBitsBtn" class="btn">Zero All Bits</button>
        </div>

        <div class="target-display">
          <div class="target-label" id="targetLabel">Target Value (Decimal):</div>
          <div class="target-value" id="targetValue">179</div>
        </div>

        <!-- 8-Bit Switchboard -->
        <div class="switchboard" id="switchboard">
          <!-- 8 Bits from 128 down to 1 -->
        </div>

        <!-- Live Readouts -->
        <div class="readout-grid">
          <div class="readout-item">
            <span class="readout-label">Decimal</span>
            <span class="readout-val" id="readoutDec">0</span>
          </div>
          <div class="readout-item">
            <span class="readout-label">Hexadecimal</span>
            <span class="readout-val" id="readoutHex">0x00</span>
          </div>
          <div class="readout-item">
            <span class="readout-label">Binary Byte</span>
            <span class="readout-val" id="readoutBin">0000 0000</span>
          </div>
          <div class="readout-item">
            <span class="readout-label">ASCII Char</span>
            <span class="readout-val" id="readoutAscii">NUL</span>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>Built with ❤️ for <a href="https://github.com/praveenscience/One-File-Tools" target="_blank" rel="noopener noreferrer">One File Tools</a>. Zero build step. Zero dependencies. Open and run anywhere.</p>
    </footer>

    <script>
      const weights = [128, 64, 32, 16, 8, 4, 2, 1];
      let bits = [0, 0, 0, 0, 0, 0, 0, 0];
      let targetNumber = 179;
      let currentMode = "decimal";
      let score = parseInt(localStorage.getItem("quest_binhex_score") || "0", 10);
      let streak = parseInt(localStorage.getItem("quest_binhex_streak") || "0", 10);

      const switchboard = document.getElementById("switchboard");
      const targetLabel = document.getElementById("targetLabel");
      const targetValue = document.getElementById("targetValue");
      const readoutDec = document.getElementById("readoutDec");
      const readoutHex = document.getElementById("readoutHex");
      const readoutBin = document.getElementById("readoutBin");
      const readoutAscii = document.getElementById("readoutAscii");
      const scoreDisplay = document.getElementById("scoreDisplay");
      const streakDisplay = document.getElementById("streakDisplay");
      const resetBitsBtn = document.getElementById("resetBitsBtn");
      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");

      // Audio
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playTone(freq, type = "sine", duration = 0.1) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      // Theme
      let currentTheme = localStorage.getItem("binhex_theme") || "dark";
      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        themeIcon.textContent = t === "dark" ? "☀️" : "🌙";
        localStorage.setItem("binhex_theme", t);
      }
      applyTheme(currentTheme);
      themeToggle.addEventListener("click", () => {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(currentTheme);
      });

      function renderSwitchboard() {
        switchboard.innerHTML = "";
        weights.forEach((w, idx) => {
          const col = document.createElement("div");
          col.className = "bit-column";

          const label = document.createElement("span");
          label.className = "bit-weight";
          label.textContent = w;

          const btn = document.createElement("button");
          btn.className = `bit-switch ${bits[idx] ? "on" : ""}`;
          btn.textContent = bits[idx];
          btn.addEventListener("click", () => {
            bits[idx] = bits[idx] ? 0 : 1;
            playTone(bits[idx] ? 440 + w * 1.5 : 220);
            updateReadout();
            checkVictory();
            renderSwitchboard();
          });

          col.appendChild(label);
          col.appendChild(btn);
          switchboard.appendChild(col);
        });
      }

      function computeCurrentValue() {
        return bits.reduce((acc, bit, idx) => acc + bit * weights[idx], 0);
      }

      function updateReadout() {
        const val = computeCurrentValue();
        readoutDec.textContent = val;
        readoutHex.textContent = "0x" + val.toString(16).toUpperCase().padStart(2, "0");

        const upper = bits.slice(0, 4).join("");
        const lower = bits.slice(4, 8).join("");
        readoutBin.textContent = `${upper} ${lower}`;

        if (val >= 32 && val <= 126) {
          readoutAscii.textContent = `'${String.fromCharCode(val)}'`;
        } else if (val === 0) {
          readoutAscii.textContent = "NUL";
        } else {
          readoutAscii.textContent = "CTRL";
        }
      }

      function newTarget() {
        targetNumber = Math.floor(Math.random() * 255) + 1;
        if (currentMode === "decimal") {
          targetLabel.textContent = "Target Value (Decimal):";
          targetValue.textContent = targetNumber;
        } else if (currentMode === "hex") {
          targetLabel.textContent = "Target Value (Hexadecimal):";
          targetValue.textContent = "0x" + targetNumber.toString(16).toUpperCase().padStart(2, "0");
        } else {
          targetLabel.textContent = "Free Exploration Mode";
          targetValue.textContent = "Flip any bit";
        }
      }

      function checkVictory() {
        if (currentMode === "free") return;
        const val = computeCurrentValue();
        if (val === targetNumber) {
          playTone(660, "sine", 0.25);
          setTimeout(() => playTone(880, "sine", 0.3), 150);
          streak++;
          score += 30;
          scoreDisplay.textContent = score;
          streakDisplay.textContent = streak;
          localStorage.setItem("quest_binhex_score", score);
          localStorage.setItem("quest_binhex_streak", streak);

          targetValue.style.color = "var(--accent-emerald)";
          setTimeout(() => {
            targetValue.style.color = "var(--accent-cyan)";
            bits = [0, 0, 0, 0, 0, 0, 0, 0];
            newTarget();
            renderSwitchboard();
            updateReadout();
          }, 800);
        }
      }

      resetBitsBtn.addEventListener("click", () => {
        bits = [0, 0, 0, 0, 0, 0, 0, 0];
        updateReadout();
        renderSwitchboard();
      });

      document.querySelectorAll(".mode-chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          document.querySelectorAll(".mode-chip").forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
          currentMode = chip.getAttribute("data-mode");
          newTarget();
        });
      });

      scoreDisplay.textContent = score;
      streakDisplay.textContent = streak;
      renderSwitchboard();
      newTarget();
      updateReadout();
    </script>
  </body>
</html>
