<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Type Coercion Gauntlet: The JavaScript Comparison Arena — One File Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --border-color: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-amber: #f59e0b;
        --accent-cyan: #06b6d4;
        --accent-indigo: #6366f1;
        --accent-emerald: #10b981;
        --accent-rose: #f43f5e;
        --font-sans: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --font-heading: "Oxanium", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --bg-primary: #f8fafc;
          --bg-secondary: #ffffff;
          --bg-tertiary: #f1f5f9;
          --border-color: #cbd5e1;
          --text-primary: #0f172a;
          --text-secondary: #475569;
          --accent-amber: #d97706;
          --accent-cyan: #0891b2;
          --accent-indigo: #4f46e5;
          --accent-emerald: #059669;
          --accent-rose: #e11d48;
        }
      }

      [data-theme="dark"] {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --border-color: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-amber: #f59e0b;
        --accent-cyan: #06b6d4;
        --accent-indigo: #6366f1;
        --accent-emerald: #10b981;
        --accent-rose: #f43f5e;
      }

      [data-theme="light"] {
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f1f5f9;
        --border-color: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --accent-amber: #d97706;
        --accent-cyan: #0891b2;
        --accent-indigo: #4f46e5;
        --accent-emerald: #059669;
        --accent-rose: #e11d48;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        transition:
          background-color 0.2s,
          color 0.2s;
      }

      header {
        background-color: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .logo-group h1 {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .logo-group p {
        color: var(--text-secondary);
        font-size: 0.8125rem;
      }

      .stats-bar {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .stat-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-family: var(--font-heading);
        font-size: 1.125rem;
        font-weight: 700;
      }

      .theme-btn {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.45rem 0.85rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.8125rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        transition: all 0.2s;
      }

      .theme-btn:hover {
        border-color: var(--accent-cyan);
      }

      main {
        max-width: 900px;
        width: 100%;
        margin: 2rem auto;
        padding: 0 1.5rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .arena-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        position: relative;
        overflow: hidden;
      }

      .progress-bar-bg {
        width: 100%;
        height: 6px;
        background: var(--bg-tertiary);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent-cyan), var(--accent-indigo));
        width: 10%;
        transition: width 0.3s ease;
      }

      .question-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .round-badge {
        font-family: var(--font-heading);
        font-size: 0.875rem;
        font-weight: 800;
        color: var(--accent-amber);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .expression-box {
        background: #090d16;
        border: 2px solid #1e293b;
        border-radius: 12px;
        padding: 2.5rem 1.5rem;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent-cyan);
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      .option-btn {
        background: var(--bg-tertiary);
        border: 2px solid var(--border-color);
        color: var(--text-primary);
        padding: 1.25rem 1rem;
        border-radius: 12px;
        font-family: var(--font-mono);
        font-size: 1.125rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .option-btn:hover {
        border-color: var(--accent-indigo);
        transform: translateY(-2px);
      }

      .option-btn.correct {
        background: rgba(16, 185, 129, 0.2);
        border-color: var(--accent-emerald);
        color: #34d399;
      }

      .option-btn.wrong {
        background: rgba(244, 63, 94, 0.2);
        border-color: var(--accent-rose);
        color: #fb7185;
      }

      .explanation-card {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 1.25rem;
        display: none;
        flex-direction: column;
        gap: 0.75rem;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .next-btn {
        background: var(--accent-indigo);
        color: #fff;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-family: var(--font-heading);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        align-self: flex-end;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s;
      }

      .next-btn:hover {
        filter: brightness(1.15);
      }

      footer {
        background-color: var(--bg-secondary);
        border-top: 1px solid var(--border-color);
        padding: 1.5rem;
        text-align: center;
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      footer a {
        color: var(--accent-cyan);
        text-decoration: none;
        font-weight: 600;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 600px) {
        .expression-box {
          font-size: 1.5rem;
        }
        .options-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-group">
        <h1>⚔️ Type Coercion Gauntlet</h1>
        <p>Survive JavaScript's most notorious equality comparisons</p>
      </div>
      <div class="stats-bar">
        <div class="stat-item" style="color: var(--accent-amber)">⭐ <span id="scoreDisplay">0</span></div>
        <div class="stat-item" style="color: var(--accent-emerald)">🔥 <span id="streakDisplay">0</span> Streak</div>
        <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </header>

    <main>
      <div class="arena-card">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>

        <div class="question-header">
          <span class="round-badge" id="roundBadge">Round 1 of 10</span>
          <span style="font-size: 0.8125rem; color: var(--text-secondary)">Standard ECMAScript Abstract Equality</span>
        </div>

        <div class="expression-box" id="expressionBox">[] == ![]</div>

        <div class="options-grid" id="optionsGrid">
          <!-- Dynamic buttons -->
        </div>

        <div class="explanation-card" id="explanationCard">
          <div style="font-weight: 700; color: var(--text-primary); font-size: 0.9375rem" id="verdictTitle">Explanation</div>
          <p style="font-size: 0.875rem; color: var(--text-secondary); line-height: 1.5" id="explanationText"></p>
          <button class="next-btn" id="nextBtn">Next Challenge ➔</button>
        </div>
      </div>
    </main>

    <footer>
      <p>Built with ❤️ for <a href="https://github.com/praveenscience/One-File-Tools" target="_blank" rel="noopener noreferrer">One File Tools</a>. Zero build step. Zero dependencies. Open and run anywhere.</p>
    </footer>

    <script>
      const questions = [
        {
          expr: "[] == ![]",
          options: ["true", "false", "TypeError", "undefined"],
          answer: "true",
          expl: '1. The NOT operator ! has higher precedence: ![] evaluates to false.\n2. We now compare [] == false.\n3. The Abstract Equality algorithm converts false to 0, and [] calls ToPrimitive which becomes empty string "".\n4. "" == 0 coerces the empty string to Number("") which is 0.\n5. 0 == 0 evaluates to true!'
        },
        {
          expr: "null == undefined",
          options: ["true", "false", "TypeError", "NaN"],
          answer: "true",
          expl: "According to ECMAScript Section 7.2.14: If Type(x) is null and Type(y) is undefined (or vice-versa), return true without coercing either to number."
        },
        {
          expr: "NaN === NaN",
          options: ["false", "true", "TypeError", "undefined"],
          answer: "false",
          expl: "In IEEE 754 floating point arithmetic and JavaScript specification: If x is NaN, then x === x is always false. Use Number.isNaN() instead."
        },
        {
          expr: '"5" - 3',
          options: ["2", '"53"', "NaN", "TypeError"],
          answer: "2",
          expl: 'The subtraction operator (-) only exists for numbers. JavaScript implicitly calls ToNumeric("5") -> 5. 5 - 3 = 2.'
        },
        {
          expr: '"5" + 3',
          options: ['"53"', "8", "NaN", "TypeError"],
          answer: '"53"',
          expl: "If either operand in a plus (+) operation is a string, JavaScript triggers string concatenation instead of numeric addition."
        },
        {
          expr: "true + true",
          options: ["2", "true", '"truetrue"', "1"],
          answer: "2",
          expl: "The binary plus operator coerces both boolean values to numbers: Number(true) === 1. Therefore, 1 + 1 = 2."
        },
        {
          expr: 'false == "0"',
          options: ["true", "false", "TypeError", "undefined"],
          answer: "true",
          expl: 'Both operands are coerced to numbers: Number(false) === 0 and Number("0") === 0. 0 == 0 evaluates to true.'
        },
        {
          expr: '[1, 2] == "1,2"',
          options: ["true", "false", "TypeError", "undefined"],
          answer: "true",
          expl: 'When comparing an Object to a String, the object calls ToPrimitive() which invokes Array.prototype.toString(). [1, 2].toString() becomes "1,2", so "1,2" == "1,2" is true.'
        },
        {
          expr: "[] + {}",
          options: ['"[object Object]"', '"[object Array]"', "0", "NaN"],
          answer: '"[object Object]"',
          expl: 'Both operands call ToPrimitive: [].toString() is "" and ({}).toString() is "[object Object]". Concatenating gives "[object Object]".'
        },
        {
          expr: "typeof NaN",
          options: ['"number"', '"nan"', '"undefined"', '"object"'],
          answer: '"number"',
          expl: "In JavaScript, NaN stands for 'Not a Number', but its primitive type is still 'number' representing an invalid mathematical result."
        }
      ];

      let currentIndex = 0;
      let score = parseInt(localStorage.getItem("quest_coercion_score") || "0", 10);
      let streak = parseInt(localStorage.getItem("quest_coercion_streak") || "0", 10);
      let answered = false;

      const scoreDisplay = document.getElementById("scoreDisplay");
      const streakDisplay = document.getElementById("streakDisplay");
      const progressBar = document.getElementById("progressBar");
      const roundBadge = document.getElementById("roundBadge");
      const expressionBox = document.getElementById("expressionBox");
      const optionsGrid = document.getElementById("optionsGrid");
      const explanationCard = document.getElementById("explanationCard");
      const verdictTitle = document.getElementById("verdictTitle");
      const explanationText = document.getElementById("explanationText");
      const nextBtn = document.getElementById("nextBtn");
      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");

      // Audio Synthesis
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playTone(freq, type = "sine", duration = 0.15) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      // Theme toggle
      let currentTheme = localStorage.getItem("coercion_theme") || "dark";
      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        themeIcon.textContent = t === "dark" ? "☀️" : "🌙";
        localStorage.setItem("coercion_theme", t);
      }
      applyTheme(currentTheme);
      themeToggle.addEventListener("click", () => {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(currentTheme);
      });

      function loadQuestion(idx) {
        answered = false;
        const q = questions[idx];
        progressBar.style.width = `${((idx + 1) / questions.length) * 100}%`;
        roundBadge.textContent = `Round ${idx + 1} of ${questions.length}`;
        expressionBox.textContent = q.expr;
        explanationCard.style.display = "none";
        optionsGrid.innerHTML = "";

        q.options.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = opt;
          btn.addEventListener("click", () => handleAnswer(opt, btn));
          optionsGrid.appendChild(btn);
        });
      }

      function handleAnswer(selected, clickedBtn) {
        if (answered) return;
        answered = true;
        const q = questions[currentIndex];
        const isCorrect = selected === q.answer;

        document.querySelectorAll(".option-btn").forEach((btn) => {
          if (btn.textContent === q.answer) btn.classList.add("correct");
          else if (btn === clickedBtn) btn.classList.add("wrong");
        });

        if (isCorrect) {
          playTone(587.33);
          streak++;
          score += 25 * streak;
          verdictTitle.innerHTML = "✅ Correct!";
          verdictTitle.style.color = "var(--accent-emerald)";
        } else {
          playTone(200, "sawtooth", 0.3);
          streak = 0;
          verdictTitle.innerHTML = "❌ Coercion Trap!";
          verdictTitle.style.color = "var(--accent-rose)";
        }

        scoreDisplay.textContent = score;
        streakDisplay.textContent = streak;
        localStorage.setItem("quest_coercion_score", score);
        localStorage.setItem("quest_coercion_streak", streak);

        explanationText.textContent = q.expl;
        explanationCard.style.display = "flex";

        if (currentIndex === questions.length - 1) {
          nextBtn.textContent = "Finish Quest 🏆";
        }
      }

      nextBtn.addEventListener("click", () => {
        if (currentIndex < questions.length - 1) {
          currentIndex++;
          loadQuestion(currentIndex);
        } else {
          expressionBox.textContent = "🏆 Gauntlet Complete!";
          optionsGrid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 2rem;">
              <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem">You survived Type Coercion!</h3>
              <p style="color: var(--text-secondary)">Final Score: ${score} points | Max Streak: ${streak}</p>
            </div>
          `;
          explanationCard.style.display = "none";
        }
      });

      // Init
      scoreDisplay.textContent = score;
      streakDisplay.textContent = streak;
      loadQuestion(0);
    </script>
  </body>
</html>
