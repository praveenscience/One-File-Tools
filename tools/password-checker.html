<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Strength Checker — One File Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="border-b border-gray-200 dark:border-gray-800 p-4 bg-white dark:bg-gray-900 shadow-sm">
      <div class="max-w-4xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
          🔒 Password Strength Checker
        </h1>
        <span class="text-xs bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 px-2.5 py-1 rounded-full font-medium">Easy Tool</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center my-auto">
      <div class="bg-white dark:bg-gray-900 p-6 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm space-y-6">
        <div>
          <label for="password" class="block text-sm font-semibold mb-2 text-gray-600 dark:text-gray-400">Enter Password to Check:</label>
          <div class="relative">
            <input type="password" id="password" class="w-full p-4 pr-12 rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-950 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm shadow-sm" placeholder="Type your password here..." />
            <button id="toggleBtn" type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 text-xs font-semibold">SHOW</button>
          </div>
        </div>

        <!-- Strength Meter Bar -->
        <div class="space-y-2">
          <div class="flex justify-between items-center text-sm">
            <span class="text-gray-500 dark:text-gray-400 font-medium">Strength:</span>
            <span id="strengthText" class="font-bold text-gray-400">Not Entered</span>
          </div>
          <div class="w-full h-2.5 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden">
            <div id="strengthBar" class="h-full w-0 transition-all duration-300 bg-gray-300"></div>
          </div>
        </div>

        <!-- Criteria checklist -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 text-sm">
          <div id="lengthCheck" class="flex items-center gap-2 text-gray-400">
            <span class="bullet">❌</span> At least 8 characters
          </div>
          <div id="upperCheck" class="flex items-center gap-2 text-gray-400">
            <span class="bullet">❌</span> Uppercase letter (A-Z)
          </div>
          <div id="lowerCheck" class="flex items-center gap-2 text-gray-400">
            <span class="bullet">❌</span> Lowercase letter (a-z)
          </div>
          <div id="numberCheck" class="flex items-center gap-2 text-gray-400">
            <span class="bullet">❌</span> Number (0-9)
          </div>
          <div id="specialCheck" class="flex items-center gap-2 text-gray-400 sm:col-span-2">
            <span class="bullet">❌</span> Special character (!@#$%^&*)
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 py-4 text-center text-sm text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-900">
      <p>Part of <a href="https://github.com/praveenscience/One-File-Tools" class="text-indigo-600 dark:text-indigo-400 underline hover:font-semibold">One File Tools</a></p>
    </footer>

    <!-- Logic Script -->
    <script>
      const password = document.getElementById('password');
      const toggleBtn = document.getElementById('toggleBtn');
      const strengthBar = document.getElementById('strengthBar');
      const strengthText = document.getElementById('strengthText');

      const lengthCheck = document.getElementById('lengthCheck');
      const upperCheck = document.getElementById('upperCheck');
      const lowerCheck = document.getElementById('lowerCheck');
      const numberCheck = document.getElementById('numberCheck');
      const specialCheck = document.getElementById('specialCheck');

      toggleBtn.addEventListener('click', () => {
        if (password.type === 'password') {
          password.type = 'text';
          toggleBtn.textContent = 'HIDE';
        } else {
          password.type = 'password';
          toggleBtn.textContent = 'SHOW';
        }
      });

      password.addEventListener('input', (e) => {
        const val = e.target.value;
        let score = 0;

        const hasLength = val.length >= 8;
        const hasUpper = /[A-Z]/.test(val);
        const hasLower = /[a-z]/.test(val);
        const hasNumber = /[0-9]/.test(val);
        const hasSpecial = /[^A-Za-z0-9]/.test(val);

        updateCriterion(lengthCheck, hasLength);
        updateCriterion(upperCheck, hasUpper);
        updateCriterion(lowerCheck, hasLower);
        updateCriterion(numberCheck, hasNumber);
        updateCriterion(specialCheck, hasSpecial);

        if (hasLength) score++;
        if (hasUpper) score++;
        if (hasLower) score++;
        if (hasNumber) score++;
        if (hasSpecial) score++;

        if (val.length === 0) {
          strengthBar.style.width = '0%';
          strengthBar.className = 'h-full transition-all duration-300 bg-gray-300';
          strengthText.textContent = 'Not Entered';
          strengthText.className = 'font-bold text-gray-400';
          return;
        }

        if (score <= 2) {
          strengthBar.style.width = '33%';
          strengthBar.className = 'h-full transition-all duration-300 bg-red-500';
          strengthText.textContent = 'Weak';
          strengthText.className = 'font-bold text-red-500';
        } else if (score <= 4) {
          strengthBar.style.width = '66%';
          strengthBar.className = 'h-full transition-all duration-300 bg-yellow-500';
          strengthText.textContent = 'Medium';
          strengthText.className = 'font-bold text-yellow-500';
        } else {
          strengthBar.style.width = '100%';
          strengthBar.className = 'h-full transition-all duration-300 bg-green-500';
          strengthText.textContent = 'Strong';
          strengthText.className = 'font-bold text-green-500';
        }
      });

      function updateCriterion(el, isValid) {
        const bullet = el.querySelector('.bullet');
        if (isValid) {
          bullet.textContent = '✅';
          el.className = 'flex items-center gap-2 text-green-600 dark:text-green-400 font-medium';
        } else {
          bullet.textContent = '❌';
          el.className = 'flex items-center gap-2 text-gray-400';
        }
      }
    </script>
  </body>
</html>
