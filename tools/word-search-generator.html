<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Retro Pixel-Art Pastel Winter Word Search Studio with browser frame UI, pixel hearts, clouds, and snowman mascot." />
    <title>Pixel Winter Word Search Studio — One File Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("word-search-theme");
          document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch {
          document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --bg-pattern: #dbeafe;
        --surface: #ffffff;
        --surface-frame: #5b6e9c;
        --surface-bar: #778bbd;
        --text-pixel: #3b4269;
        --text-light: #ffffff;
        --muted: #64748b;
        --accent: #5b6e9c;
        --accent-hover: #45547a;
        --accent-soft: #e0e7ff;
        --pixel-blue: #7a8cb9;
        --success-pixel: #4ade80;
        --radius-retro: 16px;
        --font-pixel: "Pixelify Sans", "VT323", monospace;
        --font-sans: "Inter", system-ui, sans-serif;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg-pattern: #1e293b;
        --surface: #0f172a;
        --surface-frame: #334155;
        --surface-bar: #475569;
        --text-pixel: #f8fafc;
        --muted: #94a3b8;
        --accent-soft: #1e293b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-pattern);
        /* Pastel Argyle / Diamond Checkered Pattern */
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 25%, transparent 25%), linear-gradient(225deg, rgba(255, 255, 255, 0.4) 25%, transparent 25%), linear-gradient(45deg, rgba(255, 255, 255, 0.4) 25%, transparent 25%), linear-gradient(315deg, rgba(255, 255, 255, 0.4) 25%, transparent 25%);
        background-position:
          24px 0,
          24px 0,
          0 0,
          0 0;
        background-size: 48px 48px;
        color: var(--text-pixel);
        font-family: var(--font-sans);
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        user-select: none;
        position: relative;
        overflow-x: hidden;
      }

      /* Pixel Sky Clouds Top Header */
      .pixel-sky {
        width: 100%;
        height: 60px;
        background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="30" viewBox="0 0 100 30"><path d="M10 20 Q 25 10 40 20 Q 55 10 70 20 Q 85 10 90 20 L 100 20 L 100 0 L 0 0 L 0 20 Z" fill="white"/></svg>') repeat-x;
        background-size: 200px 60px;
      }

      /* Pixel Hearts Bar */
      .pixel-hud {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-top: -10px;
        font-family: var(--font-pixel);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--surface-frame);
      }
      .pixel-heart {
        display: inline-block;
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.1));
      }

      .app-wrapper {
        flex: 1;
        max-width: 900px;
        width: 100%;
        margin: 1.5rem auto 3rem auto;
        padding: 0 1.25rem;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      /* Retro Browser Window Frame */
      .browser-window {
        background: var(--surface);
        border: 4px solid var(--surface-frame);
        border-radius: var(--radius-retro);
        box-shadow:
          0 12px 36px rgba(59, 66, 105, 0.2),
          inset 0 0 0 2px #fff;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .browser-bar {
        background: var(--surface-frame);
        padding: 0.6rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .browser-url-box {
        flex: 1;
        max-width: 480px;
        background: #ffffff;
        border-radius: 20px;
        padding: 0.35rem 1rem;
        font-family: var(--font-pixel);
        font-size: 1.15rem;
        color: var(--surface-frame);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: 2px solid var(--surface-bar);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
      }

      .browser-content {
        padding: 1.75rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .pixel-banner {
        font-family: var(--font-pixel);
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--surface-frame);
        text-align: center;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin: 0;
        text-shadow:
          2px 2px 0px #ffffff,
          4px 4px 0px rgba(91, 110, 156, 0.2);
      }

      .pixel-subtitle {
        font-family: var(--font-pixel);
        font-size: 1.25rem;
        color: var(--muted);
        margin-top: -0.5rem;
      }

      /* Control Toolbar */
      .pixel-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.85rem;
        width: 100%;
      }
      select {
        font-family: var(--font-pixel);
        font-size: 1.1rem;
        padding: 0.45rem 0.85rem;
        border-radius: 20px;
        border: 2px solid var(--surface-frame);
        background: #fff;
        color: var(--surface-frame);
        outline: none;
        cursor: pointer;
      }

      .pixel-btn {
        font-family: var(--font-pixel);
        font-size: 1.15rem;
        font-weight: 700;
        padding: 0.55rem 1.25rem;
        border-radius: 25px;
        border: 3px solid var(--surface-frame);
        background: #ffffff;
        color: var(--surface-frame);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        box-shadow: 0 4px 0px var(--surface-frame);
        transition: all 0.1s ease;
      }
      .pixel-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0px var(--surface-frame);
      }
      .pixel-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0px var(--surface-frame);
      }
      .pixel-btn.primary {
        background: var(--surface-frame);
        color: #ffffff;
      }

      /* Interactive Pixel Word Grid */
      .puzzle-container {
        background: #f8fafc;
        border: 3px dashed var(--surface-frame);
        border-radius: var(--radius-retro);
        padding: 1.25rem;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .word-grid {
        display: grid;
        gap: 4px;
        touch-action: none;
      }
      .grid-cell {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        font-family: var(--font-pixel);
        font-size: 1.4rem;
        font-weight: 700;
        background: #ffffff;
        border: 2px solid var(--surface-frame);
        border-radius: 8px;
        color: var(--surface-frame);
        cursor: pointer;
        transition: all 0.12s ease;
        box-shadow: 0 3px 0px var(--surface-frame);
      }
      .grid-cell:hover {
        background: #e0e7ff;
        transform: scale(1.06);
      }
      .grid-cell.selecting {
        background: var(--surface-frame);
        color: #ffffff;
        transform: scale(1.1);
        box-shadow: 0 4px 0px #3b4269;
        z-index: 10;
      }
      .grid-cell.found {
        background: #86efac;
        color: #14532d;
        border-color: #16a34a;
        box-shadow: 0 3px 0px #15803d;
      }
      .grid-cell.revealed {
        background: #fed7aa;
        border-color: #f97316;
        color: #9a3412;
      }

      /* Word Pills */
      .word-bank {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.6rem;
        width: 100%;
      }
      .word-pill {
        font-family: var(--font-pixel);
        font-size: 1.15rem;
        font-weight: 700;
        padding: 0.35rem 0.85rem;
        border-radius: 20px;
        background: #ffffff;
        border: 2px solid var(--surface-frame);
        color: var(--surface-frame);
        display: flex;
        align-items: center;
        gap: 0.4rem;
        box-shadow: 0 3px 0px var(--surface-frame);
      }
      .word-pill.found {
        background: #dcfce7;
        border-color: #22c55e;
        color: #15803d;
        text-decoration: line-through;
      }

      /* Bottom Pixel Snowman Mascot */
      .snowman-footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: 1rem;
      }
      .pixel-snowman {
        font-size: 4rem;
        filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.1));
      }

      @media print {
        .browser-bar,
        .pixel-controls,
        button,
        .pixel-sky {
          display: none !important;
        }
        body {
          background: #fff;
          color: #000;
        }
        .grid-cell {
          border: 1px solid #999;
          color: #000;
          background: #fff;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Top Pixel Sky Pattern -->
    <div class="pixel-sky"></div>

    <!-- Pixel Hearts HUD -->
    <div class="pixel-hud">
      <span class="pixel-heart">💜</span>
      <span class="pixel-heart">💜</span>
      <span class="pixel-heart">💜</span>
      <span class="pixel-heart">💜</span>
      <span id="scoreText">100%</span>
    </div>

    <main class="app-wrapper">
      <!-- Retro Browser Container Frame -->
      <div class="browser-window">
        <!-- Browser Header Bar -->
        <div class="browser-bar">
          <div style="font-size: 1.2rem">❄️</div>
          <div class="browser-url-box">
            <span>🔒</span>
            <span>www.winterwordsearch.com</span>
          </div>
          <button id="themeToggle" class="pixel-btn" style="padding: 0.2rem 0.6rem; font-size: 0.9rem">☀️</button>
        </div>

        <!-- Browser Content Stage -->
        <div class="browser-content">
          <h1 class="pixel-banner">WINTER WORD SEARCH</h1>
          <div class="pixel-subtitle">FIND ALL HIDDEN WORDS IN THE ICE GRID!</div>

          <!-- Controls Toolbar -->
          <div class="pixel-controls">
            <select id="presetSelect" aria-label="Preset Category">
              <option value="winter">❄️ Winter Words</option>
              <option value="prog">💻 Code Languages</option>
              <option value="frameworks">🌐 Web Frameworks</option>
              <option value="animals">🐾 Wildlife</option>
            </select>

            <select id="sizeSelect" aria-label="Grid Size">
              <option value="10">10 x 10</option>
              <option value="12" selected>12 x 12</option>
            </select>

            <button id="btnGenerate" class="pixel-btn primary">🔄 RESET</button>
            <button id="btnReveal" class="pixel-btn">👁️ SOLVE</button>
            <button id="btnPrint" class="pixel-btn">🖨️ PRINT</button>
          </div>

          <!-- Word Grid Canvas Container -->
          <div class="puzzle-container">
            <div id="gridContainer" class="word-grid"></div>
          </div>

          <!-- Words Bank Display -->
          <div id="wordListContainer" class="word-bank"></div>
        </div>
      </div>

      <!-- Footer Snowman Mascot & Pine Trees -->
      <div class="snowman-footer">
        <div style="font-family: var(--font-pixel); font-size: 1.2rem; color: var(--surface-frame)">🌲 🌲 🌲 PIPELINE WINTER EDITION</div>
        <div class="pixel-snowman" title="Hello Winter!">⛄</div>
      </div>
    </main>

    <script>
      const PRESETS = {
        winter: ["SNOWFLAKE", "BLIZZARD", "ICEBERG", "GLACIER", "FROST", "REINDEER", "MITTENS", "SLEIGH"],
        prog: ["JAVASCRIPT", "PYTHON", "TYPESCRIPT", "RUST", "KOTLIN", "GOLANG", "SWIFT", "DART"],
        frameworks: ["REACT", "ANGULAR", "VUE", "NEXTJS", "SVELTE", "EXPRESS", "TAILWIND", "FLUTTER"],
        animals: ["DOLPHIN", "PANTHER", "CHEETAH", "FALCON", "PENGUIN", "GIRAFFE", "ELEPHANT", "OCTOPUS"]
      };

      const $ = (id) => document.getElementById(id);

      let grid = [];
      let size = 12;
      let words = [...PRESETS.winter];
      let foundWords = new Set();
      let wordLocations = {};
      let isSelecting = false;
      let selection = [];

      function init() {
        $("presetSelect").addEventListener("change", (e) => {
          words = [...PRESETS[e.target.value]];
          generatePuzzle();
        });

        $("sizeSelect").addEventListener("change", (e) => {
          size = parseInt(e.target.value, 10);
          generatePuzzle();
        });

        $("btnGenerate").addEventListener("click", generatePuzzle);
        $("btnReveal").addEventListener("click", revealAnswers);
        $("btnPrint").addEventListener("click", () => window.print());
        $("themeToggle").addEventListener("click", toggleTheme);

        generatePuzzle();
      }

      function toggleTheme() {
        const current = document.documentElement.dataset.theme;
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("word-search-theme", next);
      }

      function generatePuzzle() {
        foundWords.clear();
        wordLocations = {};
        grid = Array(size)
          .fill(null)
          .map(() => Array(size).fill(""));

        const directions = [
          [0, 1],
          [1, 0],
          [1, 1],
          [-1, 1]
        ];

        words.forEach((word) => {
          let placed = false;
          let attempts = 0;
          while (!placed && attempts < 100) {
            attempts++;
            const dir = directions[Math.floor(Math.random() * directions.length)];
            const row = Math.floor(Math.random() * size);
            const col = Math.floor(Math.random() * size);

            if (canPlace(word, row, col, dir)) {
              const coords = [];
              for (let i = 0; i < word.length; i++) {
                const r = row + dir[0] * i;
                const c = col + dir[1] * i;
                grid[r][c] = word[i];
                coords.push({ r, c });
              }
              wordLocations[word] = coords;
              placed = true;
            }
          }
        });

        const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (!grid[r][c]) {
              grid[r][c] = alpha[Math.floor(Math.random() * alpha.length)];
            }
          }
        }

        renderGrid();
        renderWordList();
      }

      function canPlace(word, r, c, dir) {
        for (let i = 0; i < word.length; i++) {
          const nr = r + dir[0] * i;
          const nc = c + dir[1] * i;
          if (nr < 0 || nr >= size || nc < 0 || nc >= size) return false;
          if (grid[nr][nc] && grid[nr][nc] !== word[i]) return false;
        }
        return true;
      }

      function renderGrid() {
        const container = $("gridContainer");
        container.style.gridTemplateColumns = `repeat(${size}, 38px)`;
        container.innerHTML = "";

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const cell = document.createElement("div");
            cell.className = "grid-cell";
            cell.dataset.r = r;
            cell.dataset.c = c;
            cell.textContent = grid[r][c];

            cell.addEventListener("mousedown", () => startSelection(r, c));
            cell.addEventListener("mouseenter", () => updateSelection(r, c));
            cell.addEventListener("mouseup", endSelection);

            container.appendChild(cell);
          }
        }

        document.addEventListener("mouseup", endSelection);
      }

      function startSelection(r, c) {
        isSelecting = true;
        selection = [{ r, c }];
        highlightSelection();
      }

      function updateSelection(r, c) {
        if (!isSelecting) return;
        const start = selection[0];
        const dr = Math.sign(r - start.r);
        const dc = Math.sign(c - start.c);

        selection = [];
        let currR = start.r;
        let currC = start.c;

        while (true) {
          selection.push({ r: currR, c: currC });
          if (currR === r && currC === c) break;
          currR += dr;
          currC += dc;
          if (currR < 0 || currR >= size || currC < 0 || currC >= size) break;
        }
        highlightSelection();
      }

      function highlightSelection() {
        document.querySelectorAll(".grid-cell").forEach((cell) => {
          if (!cell.classList.contains("found")) cell.classList.remove("selecting");
        });

        selection.forEach(({ r, c }) => {
          const cell = document.querySelector(`.grid-cell[data-r="${r}"][data-c="${c}"]`);
          if (cell) cell.classList.add("selecting");
        });
      }

      function endSelection() {
        if (!isSelecting) return;
        isSelecting = false;

        const word = selection.map(({ r, c }) => grid[r][c]).join("");
        const rev = word.split("").reverse().join("");

        if (words.includes(word) && !foundWords.has(word)) {
          markFound(word);
        } else if (words.includes(rev) && !foundWords.has(rev)) {
          markFound(rev);
        } else {
          highlightSelection();
        }
        selection = [];
      }

      function markFound(word) {
        foundWords.add(word);
        const coords = wordLocations[word] || [];
        coords.forEach(({ r, c }) => {
          const cell = document.querySelector(`.grid-cell[data-r="${r}"][data-c="${c}"]`);
          if (cell) {
            cell.classList.remove("selecting");
            cell.classList.add("found");
          }
        });
        renderWordList();
      }

      function renderWordList() {
        const container = $("wordListContainer");
        container.innerHTML = words
          .map(
            (w) => `
          <div class="word-pill ${foundWords.has(w) ? "found" : ""}">
            ${foundWords.has(w) ? "✓" : "•"} ${w}
          </div>
        `
          )
          .join("");

        const pct = Math.round((foundWords.size / words.length) * 100);
        $("scoreText").textContent = pct + "%";
      }

      function revealAnswers() {
        Object.keys(wordLocations).forEach((w) => {
          wordLocations[w].forEach(({ r, c }) => {
            const cell = document.querySelector(`.grid-cell[data-r="${r}"][data-c="${c}"]`);
            if (cell) cell.classList.add("revealed");
          });
        });
      }

      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
