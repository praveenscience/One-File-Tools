<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simple Cream & Colorful Word Search Studio: create, solve, and print custom word search grids with drag-highlighting." />
    <title>Word Search Studio — One File Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("word-search-theme");
          document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch {
          document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --bg: #faf7f2;
        --surface: #ffffff;
        --surface-2: #f4efe6;
        --text: #292524;
        --muted: #78716c;
        --border: #e7e5e4;
        --border-strong: #d6d3d1;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --accent-soft: #eef2ff;
        --mint: #10b981;
        --mint-soft: #d1fae5;
        --coral: #f43f5e;
        --coral-soft: #ffe4e6;
        --amber: #f59e0b;
        --amber-soft: #fef3c7;
        --purple: #8b5cf6;
        --purple-soft: #ede9fe;
        --radius: 16px;
        --radius-sm: 10px;
        --font-sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #1c1917;
        --surface: #292524;
        --surface-2: #383533;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --border: #44403c;
        --border-strong: #57534e;
        --accent-soft: #312e81;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      header {
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        padding: 1rem 1.75rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.85rem;
      }
      .brand-icon {
        width: 42px;
        height: 42px;
        background: linear-gradient(135deg, #f43f5e 0%, #8b5cf6 50%, #6366f1 100%);
        color: #fff;
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.3rem;
        box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
      }
      h1 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--text);
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      button {
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.6rem 1.1rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        transition: all 0.18s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      button:hover {
        background: var(--surface-2);
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
      }
      button.primary {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        color: #ffffff;
        border-color: transparent;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }
      button.primary:hover {
        box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45);
      }

      .app-container {
        flex: 1;
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
        padding: 1.75rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        background: var(--surface);
        padding: 1.1rem 1.5rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        flex-wrap: wrap;
      }
      select,
      input[type="text"] {
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.6rem 0.85rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        outline: none;
      }
      select:focus,
      input:focus {
        border-color: var(--accent);
      }

      .main-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      @media (min-width: 960px) {
        .main-grid {
          grid-template-columns: 1fr 380px;
        }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      }

      /* Simple Cream & Colorful Grid */
      .puzzle-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1.25rem;
        background: var(--surface-2);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        overflow-x: auto;
      }
      .word-grid {
        display: grid;
        gap: 4px;
        touch-action: none;
      }
      .grid-cell {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        font-family: var(--font-mono);
        font-size: 1.2rem;
        font-weight: 700;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        transition: all 0.12s ease;
      }
      .grid-cell:hover {
        background: var(--purple-soft);
        border-color: var(--purple);
        transform: scale(1.05);
      }
      .grid-cell.selecting {
        background: var(--accent);
        color: #ffffff;
        border-color: var(--accent-hover);
        transform: scale(1.08);
      }
      .grid-cell.found {
        background: var(--mint);
        color: #ffffff;
        border-color: var(--mint);
      }
      .grid-cell.revealed {
        background: var(--amber-soft);
        border-color: var(--amber);
        color: #92400e;
      }

      /* Progress Bar */
      .progress-bar-bg {
        width: 100%;
        height: 10px;
        background: var(--surface-2);
        border-radius: 5px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #f43f5e, #8b5cf6, #10b981);
        transition: width 0.3s ease;
      }

      /* Colorful Word Pills */
      .word-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .word-pill {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        font-weight: 700;
        padding: 0.45rem 0.85rem;
        border-radius: 30px;
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 0.45rem;
        transition: all 0.2s ease;
      }
      .word-pill.found {
        background: var(--mint-soft);
        border-color: var(--mint);
        color: #065f46;
        text-decoration: line-through;
      }

      textarea.word-input {
        width: 100%;
        min-height: 120px;
        font-family: var(--font-mono);
        font-size: 0.875rem;
        padding: 0.85rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        resize: vertical;
        outline: none;
      }

      @media print {
        header,
        .toolbar,
        .word-input,
        button,
        .brand {
          display: none !important;
        }
        body {
          background: #fff;
          color: #000;
        }
        .puzzle-wrapper {
          border: none;
          background: transparent;
        }
        .grid-cell {
          border: 1px solid #999;
          color: #000;
          background: #fff;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🧩</div>
        <div>
          <h1>Word Search Studio</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" aria-label="Toggle dark/light theme">
          <span id="themeIcon" aria-hidden="true">☀️</span>
        </button>
        <a href="https://github.com/praveenscience/One-File-Tools" target="_blank" rel="noopener" style="text-decoration: none">
          <button type="button">GitHub</button>
        </a>
      </div>
    </header>

    <main class="app-container">
      <!-- Toolbar Controls -->
      <section class="toolbar">
        <div class="toolbar-group">
          <label style="font-size: 0.875rem; font-weight: 700">Preset Theme:</label>
          <select id="presetSelect" aria-label="Preset Theme">
            <option value="prog">💻 Programming Languages</option>
            <option value="frameworks">🌐 Web Frameworks</option>
            <option value="animals">🐾 Animals & Wildlife</option>
            <option value="countries">🌍 Countries & Capitals</option>
          </select>

          <label style="font-size: 0.875rem; font-weight: 700">Grid Size:</label>
          <select id="sizeSelect" aria-label="Grid Size">
            <option value="10">10 x 10</option>
            <option value="12" selected>12 x 12</option>
            <option value="15">15 x 15</option>
          </select>
        </div>

        <div class="toolbar-group">
          <button id="btnGenerate" class="primary" aria-label="Re-Generate Grid">🔄 Re-Generate</button>
          <button id="btnReveal" aria-label="Reveal Answers">👁️ Reveal Answers</button>
          <button id="btnPrint" aria-label="Print Puzzle">🖨️ Print</button>
        </div>
      </section>

      <!-- Main Layout Grid -->
      <div class="main-grid">
        <!-- Interactive Grid Card -->
        <section class="card">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <h2 style="font-size: 1.1rem; font-weight: 800; margin: 0">Puzzle Grid</h2>
            <span id="progressText" style="font-family: var(--font-mono); font-weight: 700; font-size: 0.9rem; color: var(--accent)">0 / 0 FOUND (0%)</span>
          </div>

          <div class="progress-bar-bg">
            <div id="progressBarFill" class="progress-bar-fill"></div>
          </div>

          <div class="puzzle-wrapper">
            <div id="gridContainer" class="word-grid"></div>
          </div>
        </section>

        <!-- Right Drawer: Word Bank & Editor -->
        <div style="display: flex; flex-direction: column; gap: 1.5rem">
          <section class="card">
            <h2 style="font-size: 1.1rem; font-weight: 800; margin: 0">Words to Find</h2>
            <div id="wordListContainer" class="word-list"></div>
          </section>

          <section class="card">
            <h2 style="font-size: 1.1rem; font-weight: 800; margin: 0">Custom Word Generator</h2>
            <textarea id="wordInput" class="word-input" placeholder="Type words separated by commas or newlines..."></textarea>
            <button id="btnUpdateWords" aria-label="Update Words">Update Word List</button>
          </section>
        </div>
      </div>
    </main>

    <script>
      function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      const PRESETS = {
        prog: ["JAVASCRIPT", "PYTHON", "TYPESCRIPT", "RUST", "KOTLIN", "GOLANG", "SWIFT", "DART"],
        frameworks: ["REACT", "ANGULAR", "VUE", "NEXTJS", "SVELTE", "EXPRESS", "TAILWIND", "FLUTTER"],
        animals: ["DOLPHIN", "PANTHER", "CHEETAH", "FALCON", "PENGUIN", "GIRAFFE", "ELEPHANT", "OCTOPUS"],
        countries: ["JAPAN", "CANADA", "BRAZIL", "GERMANY", "FRANCE", "NORWAY", "AUSTRALIA", "MEXICO"]
      };

      const $ = (id) => document.getElementById(id);

      let grid = [];
      let size = 12;
      let words = [...PRESETS.prog];
      let foundWords = new Set();
      let wordLocations = {};
      let isSelecting = false;
      let selection = [];

      function init() {
        $("presetSelect").addEventListener("change", (e) => {
          words = [...PRESETS[e.target.value]];
          $("wordInput").value = words.join(", ");
          generatePuzzle();
        });

        $("sizeSelect").addEventListener("change", (e) => {
          size = parseInt(e.target.value, 10);
          generatePuzzle();
        });

        $("btnGenerate").addEventListener("click", generatePuzzle);
        $("btnUpdateWords").addEventListener("click", () => {
          const custom = $("wordInput")
            .value.split(/[\n,]+/)
            .map((w) => w.trim().toUpperCase())
            .filter(Boolean);
          if (custom.length > 0) {
            words = custom;
            generatePuzzle();
          }
        });

        $("btnReveal").addEventListener("click", revealAnswers);
        $("btnPrint").addEventListener("click", () => window.print());
        $("themeToggle").addEventListener("click", toggleTheme);

        $("wordInput").value = words.join(", ");
        $("themeIcon").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
        generatePuzzle();
      }

      function toggleTheme() {
        const current = document.documentElement.dataset.theme;
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("word-search-theme", next);
        $("themeIcon").textContent = next === "dark" ? "☀️" : "🌙";
      }

      function generatePuzzle() {
        foundWords.clear();
        wordLocations = {};
        grid = Array(size)
          .fill(null)
          .map(() => Array(size).fill(""));

        const directions = [
          [0, 1],
          [1, 0],
          [1, 1],
          [-1, 1]
        ];

        words.forEach((word) => {
          let placed = false;
          let attempts = 0;
          while (!placed && attempts < 100) {
            attempts++;
            const dir = directions[Math.floor(Math.random() * directions.length)];
            const row = Math.floor(Math.random() * size);
            const col = Math.floor(Math.random() * size);

            if (canPlace(word, row, col, dir)) {
              const coords = [];
              for (let i = 0; i < word.length; i++) {
                const r = row + dir[0] * i;
                const c = col + dir[1] * i;
                grid[r][c] = word[i];
                coords.push({ r, c });
              }
              wordLocations[word] = coords;
              placed = true;
            }
          }
        });

        const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (!grid[r][c]) {
              grid[r][c] = alpha[Math.floor(Math.random() * alpha.length)];
            }
          }
        }

        renderGrid();
        renderWordList();
      }

      function canPlace(word, r, c, dir) {
        for (let i = 0; i < word.length; i++) {
          const nr = r + dir[0] * i;
          const nc = c + dir[1] * i;
          if (nr < 0 || nr >= size || nc < 0 || nc >= size) return false;
          if (grid[nr][nc] && grid[nr][nc] !== word[i]) return false;
        }
        return true;
      }

      function renderGrid() {
        const container = $("gridContainer");
        container.style.gridTemplateColumns = `repeat(${size}, 40px)`;
        container.innerHTML = "";

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const cell = document.createElement("div");
            cell.className = "grid-cell";
            cell.dataset.r = r;
            cell.dataset.c = c;
            cell.textContent = grid[r][c];

            cell.addEventListener("mousedown", () => startSelection(r, c));
            cell.addEventListener("mouseenter", () => updateSelection(r, c));
            cell.addEventListener("mouseup", endSelection);

            container.appendChild(cell);
          }
        }

        document.addEventListener("mouseup", endSelection);
      }

      function startSelection(r, c) {
        isSelecting = true;
        selection = [{ r, c }];
        highlightSelection();
      }

      function updateSelection(r, c) {
        if (!isSelecting) return;
        const start = selection[0];
        const dr = Math.sign(r - start.r);
        const dc = Math.sign(c - start.c);

        selection = [];
        let currR = start.r;
        let currC = start.c;

        while (true) {
          selection.push({ r: currR, c: currC });
          if (currR === r && currC === c) break;
          currR += dr;
          currC += dc;
          if (currR < 0 || currR >= size || currC < 0 || currC >= size) break;
        }
        highlightSelection();
      }

      function highlightSelection() {
        document.querySelectorAll(".grid-cell").forEach((cell) => {
          if (!cell.classList.contains("found")) cell.classList.remove("selecting");
        });

        selection.forEach(({ r, c }) => {
          const cell = document.querySelector(`.grid-cell[data-r="${r}"][data-c="${c}"]`);
          if (cell) cell.classList.add("selecting");
        });
      }

      function endSelection() {
        if (!isSelecting) return;
        isSelecting = false;

        const word = selection.map(({ r, c }) => grid[r][c]).join("");
        const rev = word.split("").reverse().join("");

        if (words.includes(word) && !foundWords.has(word)) {
          markFound(word);
        } else if (words.includes(rev) && !foundWords.has(rev)) {
          markFound(rev);
        } else {
          highlightSelection();
        }
        selection = [];
      }

      function markFound(word) {
        foundWords.add(word);
        const coords = wordLocations[word] || [];
        coords.forEach(({ r, c }) => {
          const cell = document.querySelector(`.grid-cell[data-r="${r}"][data-c="${c}"]`);
          if (cell) {
            cell.classList.remove("selecting");
            cell.classList.add("found");
          }
        });
        renderWordList();
      }

      function renderWordList() {
        const container = $("wordListContainer");
        container.innerHTML = words
          .map(
            (w) => `
          <div class="word-pill ${foundWords.has(w) ? "found" : ""}">
            ${foundWords.has(w) ? "✓" : "•"} ${escapeHtml(w)}
          </div>
        `
          )
          .join("");

        const pct = Math.round((foundWords.size / words.length) * 100);
        $("progressText").textContent = `${foundWords.size} / ${words.length} FOUND (${pct}%)`;
        $("progressBarFill").style.width = pct + "%";
      }

      function revealAnswers() {
        Object.keys(wordLocations).forEach((w) => {
          wordLocations[w].forEach(({ r, c }) => {
            const cell = document.querySelector(`.grid-cell[data-r="${r}"][data-c="${c}"]`);
            if (cell) cell.classList.add("revealed");
          });
        });
      }

      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
