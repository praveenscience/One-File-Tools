<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Real-time Abstract Syntax Tree (AST) visualizer and parser studio for JavaScript and JSON code." />
    <title>Interactive AST Visualizer & Parser Studio — One File Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("ast-studio-theme");
          document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch {
          document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-2: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --border-strong: #475569;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --accent-soft: rgba(99, 102, 241, 0.15);
        --neon-green: #10b981;
        --neon-cyan: #38bdf8;
        --neon-yellow: #f59e0b;
        --neon-purple: #a855f7;
        --radius: 12px;
        --radius-sm: 8px;
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-2: #f1f5f9;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --accent-soft: #eef2ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      header {
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .brand-icon {
        width: 38px;
        height: 38px;
        background: linear-gradient(135deg, #6366f1, #38bdf8);
        color: #fff;
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 1.2rem;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      button {
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.55rem 0.95rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--surface-2);
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        transition: all 0.18s ease;
      }
      button:hover {
        background: var(--border);
        transform: translateY(-1px);
      }
      button.primary {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
      }

      .app-container {
        flex: 1;
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        background: var(--surface);
        padding: 1rem 1.25rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      select {
        font-family: inherit;
        font-size: 0.875rem;
        padding: 0.55rem 0.75rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--text);
      }

      .studio-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      @media (min-width: 900px) {
        .studio-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-height: 520px;
      }

      textarea.code-editor {
        width: 100%;
        flex: 1;
        min-height: 320px;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        padding: 1rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--text);
        resize: vertical;
        line-height: 1.6;
        outline: none;
      }
      textarea.code-editor:focus {
        border-color: var(--accent);
      }

      /* AST Tree View */
      .ast-tree-wrapper {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 1rem;
        overflow: auto;
        max-height: 480px;
        font-family: var(--font-mono);
        font-size: 0.85rem;
      }

      .ast-node {
        margin-left: 1.25rem;
        margin-top: 0.35rem;
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .node-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        transition: background 0.12s ease;
      }
      .node-header:hover {
        background: var(--surface-2);
      }
      .node-type-badge {
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.15rem 0.45rem;
        border-radius: 4px;
        background: rgba(99, 102, 241, 0.2);
        color: var(--accent);
        border: 1px solid rgba(99, 102, 241, 0.4);
      }
      .node-prop {
        color: var(--muted);
      }
      .node-val {
        color: var(--neon-green);
      }

      /* Scope Box */
      .scope-box {
        background: var(--bg);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .symbol-pill {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        padding: 0.25rem 0.6rem;
        border-radius: 12px;
        background: var(--surface-2);
        color: var(--neon-cyan);
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }

      .toast {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border-strong);
        padding: 0.75rem 1.25rem;
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        font-weight: 600;
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.2s ease;
        z-index: 200;
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🌳</div>
        <div>
          <h1>Interactive AST Visualizer & Parser Studio</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" aria-label="Toggle dark/light theme" title="Toggle Theme">
          <span id="themeIcon" aria-hidden="true">☀️</span>
        </button>
        <a href="https://github.com/praveenscience/One-File-Tools" target="_blank" rel="noopener" style="text-decoration: none">
          <button type="button" aria-label="View on GitHub">GitHub</button>
        </a>
      </div>
    </header>

    <main class="app-container">
      <!-- Toolbar Controls -->
      <section class="toolbar">
        <div class="toolbar-group">
          <label style="font-size: 0.875rem; font-weight: 600">Preset Sample:</label>
          <select id="presetSelect" aria-label="Preset Sample">
            <option value="vars">Variable Declarations</option>
            <option value="func">Function & Return</option>
            <option value="binary">Binary Expression & Math</option>
            <option value="async">Async / Await Function</option>
          </select>
        </div>

        <div class="toolbar-group">
          <button id="btnCopyAst" class="primary" aria-label="Copy AST JSON">📋 Copy AST JSON</button>
          <button id="btnDownloadAst" aria-label="Download AST JSON">💾 Download .json</button>
        </div>
      </section>

      <!-- Main Studio Grid -->
      <div class="studio-grid">
        <!-- Left: Code Editor Card -->
        <section class="card">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <h2 style="font-size: 1rem; font-weight: 700; margin: 0">JavaScript Source Code</h2>
            <span id="codeLength" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted)">0 chars</span>
          </div>

          <textarea id="codeEditor" class="code-editor" spellcheck="false"></textarea>

          <div class="scope-box">
            <span style="font-size: 0.8rem; font-weight: 700; color: var(--muted)">DECLARED SYMBOLS & SCOPE</span>
            <div id="symbolsContainer" style="display: flex; flex-wrap: wrap; gap: 0.4rem"></div>
          </div>
        </section>

        <!-- Right: AST Tree Inspector Card -->
        <section class="card">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <h2 style="font-size: 1rem; font-weight: 700; margin: 0">AST Tree Inspector</h2>
            <span id="nodeCount" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent)">0 Nodes</span>
          </div>

          <div id="astTreeWrapper" class="ast-tree-wrapper"></div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">Copied to clipboard!</div>

    <script>
      const PRESETS = {
        vars: `let score = 100;\nconst name = "Antigravity";\nvar isActive = true;`,
        func: `function calculateTotal(price, tax) {\n  const total = price + tax;\n  return total;\n}`,
        binary: `let result = (x * 5) + (y / 2);`,
        async: `async function fetchData(url) {\n  const response = await fetch(url);\n  return response.json();\n}`
      };

      const $ = (id) => document.getElementById(id);

      function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      let currentAst = null;

      function init() {
        $("presetSelect").addEventListener("change", (e) => {
          $("codeEditor").value = PRESETS[e.target.value];
          parseAndRender();
        });

        $("codeEditor").addEventListener("input", parseAndRender);
        $("btnCopyAst").addEventListener("click", copyAst);
        $("btnDownloadAst").addEventListener("click", downloadAst);
        $("themeToggle").addEventListener("click", toggleTheme);

        $("codeEditor").value = PRESETS.vars;
        $("themeIcon").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
        parseAndRender();
      }

      function toggleTheme() {
        const current = document.documentElement.dataset.theme;
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("ast-studio-theme", next);
        $("themeIcon").textContent = next === "dark" ? "☀️" : "🌙";
      }

      // Simple Lightweight JS Tokenizer & Parser
      function parseJs(code) {
        const statements = code.split("\n").filter((line) => line.trim() !== "");
        const body = [];
        const symbols = [];

        statements.forEach((line, idx) => {
          const trimmed = line.trim();
          if (trimmed.startsWith("let ") || trimmed.startsWith("const ") || trimmed.startsWith("var ")) {
            const parts = trimmed.replace(";", "").split("=");
            const decl = parts[0].trim().split(" ");
            const kind = decl[0];
            const name = decl[1];
            symbols.push(`${kind} ${name}`);

            body.push({
              type: "VariableDeclaration",
              kind,
              declarations: [
                {
                  type: "VariableDeclarator",
                  id: { type: "Identifier", name },
                  init: { type: "Literal", value: parts[1] ? parts[1].trim() : "undefined" }
                }
              ],
              line: idx + 1
            });
          } else if (trimmed.startsWith("function ") || trimmed.startsWith("async function ")) {
            const isAsync = trimmed.startsWith("async");
            const nameMatch = trimmed.match(/function\s+([a-zA-Z0-9_]+)/);
            const fnName = nameMatch ? nameMatch[1] : "anonymous";
            symbols.push(`fn ${fnName}()`);

            body.push({
              type: "FunctionDeclaration",
              id: { type: "Identifier", name: fnName },
              async: isAsync,
              params: [],
              body: { type: "BlockStatement", body: [] },
              line: idx + 1
            });
          } else {
            body.push({
              type: "ExpressionStatement",
              expression: { type: "RawExpression", value: trimmed },
              line: idx + 1
            });
          }
        });

        return {
          type: "Program",
          sourceType: "script",
          body,
          symbols
        };
      }

      function parseAndRender() {
        const code = $("codeEditor").value;
        $("codeLength").textContent = `${code.length} chars`;

        currentAst = parseJs(code);
        renderSymbols(currentAst.symbols);
        renderTree(currentAst);
      }

      function renderSymbols(symbols) {
        const container = $("symbolsContainer");
        if (symbols.length === 0) {
          container.innerHTML = `<span style="font-size:0.8rem; color:var(--muted);">No symbols declared yet</span>`;
          return;
        }
        container.innerHTML = symbols.map((s) => `<span class="symbol-pill">📌 ${escapeHtml(s)}</span>`).join("");
      }

      function renderTree(ast) {
        const wrapper = $("astTreeWrapper");
        wrapper.innerHTML = "";
        let nodeCount = 0;

        function buildNodeEl(obj, keyName = "") {
          nodeCount++;
          const container = document.createElement("div");
          container.className = "ast-node";

          if (typeof obj === "object" && obj !== null) {
            const header = document.createElement("div");
            header.className = "node-header";

            const typeBadge = obj.type ? `<span class="node-type-badge">${escapeHtml(obj.type)}</span>` : "";
            header.innerHTML = `<span>▶</span> ${keyName ? `<span class="node-prop">${escapeHtml(keyName)}:</span>` : ""} ${typeBadge}`;
            container.appendChild(header);

            const children = document.createElement("div");
            Object.keys(obj).forEach((k) => {
              if (k !== "type" && k !== "symbols") {
                children.appendChild(buildNodeEl(obj[k], k));
              }
            });

            header.addEventListener("click", (e) => {
              e.stopPropagation();
              children.style.display = children.style.display === "none" ? "block" : "none";
            });

            container.appendChild(children);
          } else {
            container.innerHTML = `<span class="node-prop">${escapeHtml(keyName)}:</span> <span class="node-val">${escapeHtml(JSON.stringify(obj))}</span>`;
          }

          return container;
        }

        wrapper.appendChild(buildNodeEl(ast));
        $("nodeCount").textContent = `${nodeCount} Nodes`;
      }

      function copyAst() {
        navigator.clipboard.writeText(JSON.stringify(currentAst, null, 2)).then(() => showToast("Copied AST JSON to clipboard!"));
      }

      function downloadAst() {
        const blob = new Blob([JSON.stringify(currentAst, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "ast.json";
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function showToast(msg) {
        const toast = $("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      }

      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
