<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WebRTC P2P Signal & Data Channel Testing Studio: test peer connections, inspect SDP offers/answers, gather ICE candidates, and send DataChannel messages." />
    <title>WebRTC P2P Signal & Data Channel Testing Studio — One File Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("webrtc-studio-theme");
          document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch {
          document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-2: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --border-strong: #475569;
        --accent: #38bdf8;
        --accent-hover: #0284c7;
        --accent-soft: rgba(56, 189, 248, 0.15);
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --radius: 12px;
        --radius-sm: 8px;
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-2: #f1f5f9;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --accent: #0284c7;
        --accent-soft: #e0f2fe;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      header {
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .brand-icon {
        width: 38px;
        height: 38px;
        background: linear-gradient(135deg, #38bdf8, #8b5cf6);
        color: #fff;
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 1.2rem;
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      button {
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.55rem 0.95rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--surface-2);
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        transition: all 0.18s ease;
      }
      button:hover {
        background: var(--border);
        transform: translateY(-1px);
      }
      button.primary {
        background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        color: #000;
        font-weight: 700;
        border-color: #38bdf8;
        box-shadow: 0 2px 8px rgba(56, 189, 248, 0.35);
      }

      .app-container {
        flex: 1;
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        background: var(--surface);
        padding: 1rem 1.25rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      input[type="text"] {
        font-family: var(--font-mono);
        font-size: 0.875rem;
        padding: 0.55rem 0.75rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--text);
      }

      .peers-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      @media (min-width: 900px) {
        .peers-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .badge {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        background: var(--surface-2);
        color: var(--muted);
        border: 1px solid var(--border-strong);
      }
      .badge.connected {
        background: rgba(16, 185, 129, 0.2);
        color: var(--success);
        border-color: var(--success);
      }
      .badge.connecting {
        background: rgba(245, 158, 11, 0.2);
        color: var(--warning);
        border-color: var(--warning);
      }

      textarea.sdp-area {
        width: 100%;
        min-height: 150px;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        padding: 0.75rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--text);
        resize: vertical;
      }

      .console-box {
        background: var(--bg);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 0.85rem;
        height: 180px;
        overflow-y: auto;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .log-line {
        color: var(--muted);
      }
      .log-line.peer-a {
        color: var(--accent);
      }
      .log-line.peer-b {
        color: var(--success);
      }

      .toast {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border-strong);
        padding: 0.75rem 1.25rem;
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        font-weight: 600;
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.2s ease;
        z-index: 200;
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">📡</div>
        <div>
          <h1>WebRTC P2P Testing Studio</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" aria-label="Toggle dark/light theme" title="Toggle Theme">
          <span id="themeIcon" aria-hidden="true">☀️</span>
        </button>
        <a href="https://github.com/praveenscience/One-File-Tools" target="_blank" rel="noopener" style="text-decoration: none">
          <button type="button" aria-label="View on GitHub">GitHub</button>
        </a>
      </div>
    </header>

    <main class="app-container">
      <!-- Toolbar Controls -->
      <section class="toolbar">
        <div class="toolbar-group">
          <label style="font-size: 0.875rem; font-weight: 600">STUN Server:</label>
          <input type="text" id="stunUrl" value="stun:stun.l.google.com:19302" style="width: 280px" aria-label="STUN Server URL" />
        </div>

        <div class="toolbar-group">
          <button id="btnAutoConnect" class="primary" aria-label="Auto Loopback Connect">⚡ Auto Loopback Connect</button>
          <button id="btnReset" aria-label="Reset Connections">🔄 Reset Connections</button>
        </div>
      </section>

      <!-- Dual Peers Grid -->
      <div class="peers-grid">
        <!-- Peer A (Initiator) -->
        <section class="card">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <h2 style="font-size: 1rem; font-weight: 700; margin: 0">Peer A (Initiator)</h2>
            <div style="display: flex; gap: 0.4rem">
              <span id="stateA" class="badge">disconnected</span>
            </div>
          </div>

          <button id="btnCreateOffer" aria-label="Generate Offer">1. Generate Offer (SDP)</button>
          <textarea id="sdpA" class="sdp-area" placeholder="SDP Offer will appear here..." readonly></textarea>
        </section>

        <!-- Peer B (Responder) -->
        <section class="card">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <h2 style="font-size: 1rem; font-weight: 700; margin: 0">Peer B (Responder)</h2>
            <div style="display: flex; gap: 0.4rem">
              <span id="stateB" class="badge">disconnected</span>
            </div>
          </div>

          <button id="btnCreateAnswer" aria-label="Generate Answer">2. Accept & Generate Answer</button>
          <textarea id="sdpB" class="sdp-area" placeholder="SDP Answer will appear here..." readonly></textarea>
        </section>
      </div>

      <!-- DataChannel Console Card -->
      <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 style="font-size: 1rem; font-weight: 700; margin: 0">P2P DataChannel Chat & Latency Inspector</h2>
          <span id="rttText" style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent)">RTT: -- ms</span>
        </div>

        <div id="consoleLog" class="console-box">
          <div class="log-line">Click "Auto Loopback Connect" to establish live P2P DataChannel connection.</div>
        </div>

        <div style="display: flex; gap: 0.75rem">
          <input type="text" id="msgInput" placeholder="Type a DataChannel message..." style="flex: 1" />
          <button id="btnSendMsg" class="primary" aria-label="Send DataChannel Message">✉️ Send Message</button>
          <button id="btnPing" aria-label="Ping Latency">⏱️ Ping RTT</button>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">Copied to clipboard!</div>

    <script>
      const $ = (id) => document.getElementById(id);

      let pcA = null;
      let pcB = null;
      let dcA = null;
      let dcB = null;
      let pingStartTime = 0;

      function init() {
        $("btnAutoConnect").addEventListener("click", startAutoLoopback);
        $("btnReset").addEventListener("click", resetPeers);
        $("btnCreateOffer").addEventListener("click", createOfferManual);
        $("btnCreateAnswer").addEventListener("click", createAnswerManual);
        $("btnSendMsg").addEventListener("click", sendMessage);
        $("btnPing").addEventListener("click", sendPing);
        $("themeToggle").addEventListener("click", toggleTheme);

        $("msgInput").addEventListener("keypress", (e) => {
          if (e.key === "Enter") sendMessage();
        });
        $("themeIcon").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
      }

      function toggleTheme() {
        const current = document.documentElement.dataset.theme;
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("webrtc-studio-theme", next);
        $("themeIcon").textContent = next === "dark" ? "☀️" : "🌙";
      }

      function log(text, type = "normal") {
        const box = $("consoleLog");
        const div = document.createElement("div");
        div.className = `log-line ${type}`;
        div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }

      function getIceConfig() {
        const stun = $("stunUrl").value || "stun:stun.l.google.com:19302";
        return { iceServers: [{ urls: stun }] };
      }

      function resetPeers() {
        if (pcA) pcA.close();
        if (pcB) pcB.close();
        pcA = null;
        pcB = null;
        dcA = null;
        dcB = null;

        $("sdpA").value = "";
        $("sdpB").value = "";
        $("stateA").textContent = "disconnected";
        $("stateA").className = "badge";
        $("stateB").textContent = "disconnected";
        $("stateB").className = "badge";
        $("rttText").textContent = "RTT: -- ms";
        $("consoleLog").innerHTML = `<div class="log-line">Peers reset. Ready for connection.</div>`;
      }

      async function startAutoLoopback() {
        resetPeers();
        log("Initializing WebRTC Peers and ICE Gatherers...");

        const config = getIceConfig();
        pcA = new RTCPeerConnection(config);
        pcB = new RTCPeerConnection(config);

        // State changes
        pcA.onconnectionstatechange = () => updateBadge("stateA", pcA.connectionState);
        pcB.onconnectionstatechange = () => updateBadge("stateB", pcB.connectionState);

        // ICE Candidates exchange
        pcA.onicecandidate = (e) => {
          if (e.candidate) pcB.addIceCandidate(e.candidate);
        };
        pcB.onicecandidate = (e) => {
          if (e.candidate) pcA.addIceCandidate(e.candidate);
        };

        // DataChannel setup
        dcA = pcA.createDataChannel("testChannel");
        setupDataChannel(dcA, "Peer A");

        pcB.ondatachannel = (e) => {
          dcB = e.channel;
          setupDataChannel(dcB, "Peer B");
        };

        // SDP Offer / Answer
        const offer = await pcA.createOffer();
        await pcA.setLocalDescription(offer);
        $("sdpA").value = offer.sdp;

        await pcB.setRemoteDescription(offer);
        const answer = await pcB.createAnswer();
        await pcB.setLocalDescription(answer);
        $("sdpB").value = answer.sdp;

        await pcA.setRemoteDescription(answer);
        log("SDP Exchange complete. Establishing DataChannel...", "peer-a");
      }

      function setupDataChannel(dc, name) {
        dc.onopen = () => log(`DataChannel [${name}] OPEN! P2P link ready.`, "peer-a");
        dc.onmessage = (e) => {
          if (e.data === "__PING__") {
            dc.send("__PONG__");
          } else if (e.data === "__PONG__") {
            const rtt = Math.round(performance.now() - pingStartTime);
            $("rttText").textContent = `RTT: ${rtt} ms`;
            log(`Ping response received. RTT: ${rtt} ms`, "peer-b");
          } else {
            log(`${name} received: "${e.data}"`, "peer-b");
          }
        };
      }

      async function createOfferManual() {
        resetPeers();
        pcA = new RTCPeerConnection(getIceConfig());
        dcA = pcA.createDataChannel("testChannel");
        setupDataChannel(dcA, "Peer A");

        const offer = await pcA.createOffer();
        await pcA.setLocalDescription(offer);
        $("sdpA").value = offer.sdp;
        updateBadge("stateA", "connecting");
        log("Peer A SDP Offer generated.", "peer-a");
      }

      async function createAnswerManual() {
        if (!pcA) return;
        pcB = new RTCPeerConnection(getIceConfig());
        pcB.onicecandidate = (e) => {
          if (e.candidate) pcA.addIceCandidate(e.candidate);
        };
        pcA.onicecandidate = (e) => {
          if (e.candidate) pcB.addIceCandidate(e.candidate);
        };

        pcB.ondatachannel = (e) => {
          dcB = e.channel;
          setupDataChannel(dcB, "Peer B");
        };

        const offerSdp = $("sdpA").value;
        await pcB.setRemoteDescription({ type: "offer", sdp: offerSdp });
        const answer = await pcB.createAnswer();
        await pcB.setLocalDescription(answer);
        $("sdpB").value = answer.sdp;
        await pcA.setRemoteDescription(answer);

        updateBadge("stateB", "connected");
        updateBadge("stateA", "connected");
        log("Peer B SDP Answer accepted.", "peer-b");
      }

      function updateBadge(id, state) {
        const el = $(id);
        el.textContent = state;
        el.className = `badge ${state === "connected" ? "connected" : state === "connecting" ? "connecting" : ""}`;
      }

      function sendMessage() {
        const text = $("msgInput").value.trim();
        if (!text) return;
        if (dcA && dcA.readyState === "open") {
          dcA.send(text);
          log(`Peer A sent: "${text}"`, "peer-a");
          $("msgInput").value = "";
        } else {
          showToast("DataChannel not connected!");
        }
      }

      function sendPing() {
        if (dcA && dcA.readyState === "open") {
          pingStartTime = performance.now();
          dcA.send("__PING__");
          log("Sent P2P Latency Ping...", "peer-a");
        } else {
          showToast("DataChannel not connected!");
        }
      }

      function showToast(msg) {
        const toast = $("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      }

      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
