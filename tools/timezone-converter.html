<!--
Chrono / Timezone Converter
Single-file offline tool for visualizing and converting times across multiple timezones.
Built for One File Tools.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chrono / Timezone Converter - One File Tools</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
      :root {
        --bg: #030712;
        --grid-line: #111827;
        --bg-panel: rgba(17, 24, 39, 0.7);
        --panel-border: #1f2937;
        --accent: #f59e0b;
        --accent-glow: rgba(245, 158, 11, 0.15);
        --accent-hover: #d97706;
        --error: #ef4444;
        --text: #f9fafb;
        --text-muted: #9ca3af;
        --text-dim: #4b5563;
        --input-bg: rgba(3, 7, 18, 0.6);

        --font-sans: "Inter", system-ui, sans-serif;
        --font-display: "Space Grotesk", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg);
        background-image: radial-gradient(circle at 15% 50%, rgba(245, 158, 11, 0.05), transparent 25%), radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.05), transparent 25%), linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        color: var(--text);
        padding: 48px 20px 80px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .container {
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      header {
        text-align: center;
        margin-bottom: 1rem;
      }

      h1 {
        font-family: var(--font-display);
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
      }

      p.subtitle {
        color: var(--text-muted);
        font-size: 1.1rem;
      }

      .controls-bar {
        display: flex;
        gap: 1rem;
        background: var(--bg-panel);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        padding: 1rem 1.5rem;
        border-radius: 16px;
        align-items: center;
        flex-wrap: wrap;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .select-wrapper {
        flex: 1;
        min-width: 250px;
        position: relative;
      }

      select {
        width: 100%;
        appearance: none;
        background: var(--input-bg);
        border: 1px solid var(--panel-border);
        color: var(--text);
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-family: var(--font-sans);
        font-size: 0.95rem;
        outline: none;
        cursor: pointer;
        transition: border-color 0.2s;
      }

      select:focus {
        border-color: var(--accent);
      }
      
      select option {
        background: var(--bg);
        color: var(--text);
      }

      .select-icon {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        color: var(--text-muted);
      }

      .btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--panel-border);
        color: var(--text);
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        font-family: var(--font-sans);
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      /* Scrubber */
      .scrubber-panel {
        background: var(--bg-panel);
        backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .scrubber-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .scrubber-title {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .range-container {
        position: relative;
        padding: 1rem 0;
      }

      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }

      input[type=range]:focus {
        outline: none;
      }

      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px;
        cursor: pointer;
        background: var(--panel-border);
        border-radius: 99px;
      }

      input[type=range]::-webkit-slider-thumb {
        height: 24px;
        width: 24px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -9px;
        box-shadow: 0 0 15px var(--accent-glow);
        border: 2px solid #000;
        transition: transform 0.1s;
      }

      input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }

      .ticks {
        display: flex;
        justify-content: space-between;
        margin-top: 0.5rem;
        color: var(--text-dim);
        font-size: 0.75rem;
        font-family: var(--font-mono);
      }

      /* Timezone Grid */
      .tz-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
      }

      .tz-card {
        background: var(--input-bg);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        position: relative;
        transition: border-color 0.2s, background 0.2s;
      }
      
      .tz-card.working-hours {
        border-color: rgba(16, 185, 129, 0.4);
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, transparent 100%);
      }

      .tz-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .tz-name {
        font-weight: 600;
        font-size: 1.1rem;
        word-break: break-all;
      }

      .tz-region {
        color: var(--text-muted);
        font-size: 0.8rem;
        margin-top: 0.25rem;
      }

      .tz-time {
        font-family: var(--font-mono);
        font-size: 2rem;
        font-weight: 700;
        margin-top: 0.5rem;
        color: var(--accent);
      }

      .tz-date {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .tz-offset {
        display: inline-block;
        background: rgba(255,255,255,0.1);
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-family: var(--font-mono);
        margin-top: 0.5rem;
        width: fit-content;
      }

      .btn-remove {
        background: transparent;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        padding: 0.25rem;
        border-radius: 4px;
        transition: color 0.2s, background 0.2s;
      }

      .btn-remove:hover {
        color: var(--error);
        background: var(--error-bg);
      }
      
      .indicator {
        font-size: 0.75rem;
        padding: 0.2rem 0.5rem;
        border-radius: 99px;
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        width: fit-content;
        display: none;
        align-items: center;
        gap: 0.3rem;
      }
      
      .tz-card.working-hours .indicator {
        display: flex;
      }

      .toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--accent);
        color: #000;
        padding: 0.75rem 1.5rem;
        border-radius: 99px;
        font-weight: 600;
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 25px var(--accent-glow);
        z-index: 1000;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Chrono / Timezone Converter</h1>
        <p class="subtitle">Scrub the timeline to synchronize meetings across global timezones.</p>
      </header>

      <div class="controls-bar">
        <div class="select-wrapper">
          <select id="tzSelect">
            <option value="" disabled selected>Select a timezone to add...</option>
          </select>
          <i data-feather="chevron-down" class="select-icon" width="16" height="16"></i>
        </div>
        <button class="btn btn-primary" id="btnAddTz">
          <i data-feather="plus" width="16" height="16"></i>
          Add Timezone
        </button>
      </div>

      <div class="scrubber-panel">
        <div class="scrubber-header">
          <div class="scrubber-title">
            <i data-feather="clock"></i>
            Timeline
          </div>
          <button class="btn" id="btnNow">
            <i data-feather="target" width="16" height="16"></i>
            Reset to Now
          </button>
        </div>
        
        <div class="range-container">
          <!-- Range represents minutes in a day: 0 to 1439 -->
          <input type="range" id="timeScrubber" min="0" max="1439" value="0">
          <div class="ticks">
            <span>12 AM</span>
            <span>6 AM</span>
            <span>12 PM</span>
            <span>6 PM</span>
            <span>11:59 PM</span>
          </div>
        </div>

        <div class="tz-grid" id="tzGrid">
          <!-- Cards injected via JS -->
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      // Safe icon initialization
      try {
        if (typeof feather !== 'undefined') feather.replace();
      } catch (e) {
        console.error('Feather icons failed to load:', e);
      }

      // DOM Elements
      const tzSelect = document.getElementById('tzSelect');
      const btnAddTz = document.getElementById('btnAddTz');
      const btnNow = document.getElementById('btnNow');
      const timeScrubber = document.getElementById('timeScrubber');
      const tzGrid = document.getElementById('tzGrid');
      const toast = document.getElementById('toast');

      // State
      let selectedZones = [];
      let baseDate = new Date(); // Midnight of the current local day
      let currentScrubMinutes = 0;

      // Initialize
      function init() {
        populateTimezones();
        
        // Setup initial zones (Local time + a couple of popular ones)
        let localTz = 'UTC';
        try {
          localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
        } catch (e) {
          console.error("Could not resolve local timezone, defaulting to UTC.");
        }
        
        selectedZones = [localTz, 'UTC', 'America/New_York', 'Asia/Tokyo'].filter(Boolean);
        
        // Remove duplicates if localTz is one of the defaults
        selectedZones = [...new Set(selectedZones)];
        
        setupBaseDate();
        setScrubberToNow();
        
        renderCards();
      }

      function setupBaseDate() {
        const now = new Date();
        // Create a date at midnight local time today
        baseDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
      }

      function populateTimezones() {
        const fallbacks = ['UTC', 'America/New_York', 'America/Los_Angeles', 'Europe/London', 'Europe/Paris', 'Asia/Tokyo', 'Asia/Kolkata', 'Australia/Sydney'];
        let timezones = [];
        
        try {
          if (typeof Intl !== 'undefined' && typeof Intl.supportedValuesOf === 'function') {
            timezones = Intl.supportedValuesOf('timeZone');
          }
        } catch (e) {
          console.warn("Intl.supportedValuesOf('timeZone') is not supported, using fallbacks.", e);
        }

        if (!timezones || timezones.length === 0) {
          timezones = fallbacks;
        }

        timezones.forEach(tz => {
          const opt = document.createElement('option');
          opt.value = tz;
          opt.textContent = tz.replace(/_/g, ' ');
          tzSelect.appendChild(opt);
        });
      }

      function setScrubberToNow() {
        const now = new Date();
        const minutesSinceMidnight = now.getHours() * 60 + now.getMinutes();
        timeScrubber.value = minutesSinceMidnight;
        currentScrubMinutes = minutesSinceMidnight;
      }

      function getScrubbedDate() {
        return new Date(baseDate.getTime() + currentScrubMinutes * 60000);
      }

      function isWorkingHours(date, tz) {
        // Format the hour in 24h format for the specific timezone
        const hourStr = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          hour: 'numeric',
          hour12: false
        }).format(date);
        
        const hour = parseInt(hourStr, 10);
        // Working hours: 9 AM (9) to 5 PM (17)
        return hour >= 9 && hour < 17;
      }

      function renderCards() {
        tzGrid.innerHTML = '';
        const targetDate = getScrubbedDate();

        selectedZones.forEach((tz, index) => {
          const card = document.createElement('div');
          card.className = 'tz-card';
          card.dataset.tz = tz;
          
          const isPrimary = index === 0;

          // Split timezone into region and city
          const parts = tz.split('/');
          const city = parts.pop().replace(/_/g, ' ');
          const region = parts.join('/').replace(/_/g, ' ') || 'Global';

          card.innerHTML = `
            <div class="tz-header">
              <div>
                <div class="tz-name">${city} ${isPrimary ? '(Local)' : ''}</div>
                <div class="tz-region">${region}</div>
              </div>
              ${!isPrimary ? `<button class="btn-remove" data-index="${index}" title="Remove"><i data-feather="x" width="16" height="16"></i></button>` : '<div></div>'}
            </div>
            <div class="indicator"><i data-feather="sun" width="12" height="12"></i> Working Hours</div>
            <div class="tz-time" id="time-${index}">--:--</div>
            <div class="tz-date" id="date-${index}">---</div>
            <div class="tz-offset" id="offset-${index}">UTC Offset</div>
          `;
          tzGrid.appendChild(card);
        });

        if (typeof feather !== 'undefined') feather.replace();
        
        // Add listeners to remove buttons
        document.querySelectorAll('.btn-remove').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.currentTarget.dataset.index, 10);
            selectedZones.splice(idx, 1);
            renderCards();
          });
        });

        updateTimes(targetDate);
      }

      function updateTimes(date) {
        selectedZones.forEach((tz, index) => {
          const card = tzGrid.querySelector(`.tz-card[data-tz="${tz}"]`);
          if (!card) return;

          // Format Time
          const timeStr = new Intl.DateTimeFormat('en-US', {
            timeZone: tz,
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
          }).format(date);

          // Format Date
          const dateStr = new Intl.DateTimeFormat('en-US', {
            timeZone: tz,
            weekday: 'short',
            month: 'short',
            day: 'numeric'
          }).format(date);

          // Format Offset (approximated by formatting GMT offset string if possible, or using parts)
          let offsetStr = '';
          try {
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: tz,
              timeZoneName: 'shortOffset'
            }).formatToParts(date);
            const tzNamePart = parts.find(p => p.type === 'timeZoneName');
            offsetStr = tzNamePart ? tzNamePart.value : tz;
          } catch(e) {
            offsetStr = tz;
          }

          document.getElementById(`time-${index}`).textContent = timeStr;
          document.getElementById(`date-${index}`).textContent = dateStr;
          document.getElementById(`offset-${index}`).textContent = offsetStr;

          if (isWorkingHours(date, tz)) {
            card.classList.add('working-hours');
          } else {
            card.classList.remove('working-hours');
          }
        });
      }

      // Event Listeners
      timeScrubber.addEventListener('input', (e) => {
        currentScrubMinutes = parseInt(e.target.value, 10);
        updateTimes(getScrubbedDate());
      });

      btnNow.addEventListener('click', () => {
        setupBaseDate();
        setScrubberToNow();
        updateTimes(getScrubbedDate());
      });

      btnAddTz.addEventListener('click', () => {
        const tz = tzSelect.value;
        if (!tz) {
          showToast('Please select a timezone first.');
          return;
        }
        if (selectedZones.includes(tz)) {
          showToast('Timezone already added.');
          tzSelect.value = '';
          return;
        }
        selectedZones.push(tz);
        renderCards();
        tzSelect.value = '';
        showToast('Timezone added!');
      });

      // Auto-add on selection for better UX
      tzSelect.addEventListener('change', () => {
        if (tzSelect.value) {
          btnAddTz.click();
        }
      });

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }

      // Boot
      init();

    </script>
  </body>
</html>
