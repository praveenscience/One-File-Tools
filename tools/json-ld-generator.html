<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON-LD & Schema.org Structured Data Generator — One File Tools</title>
    <script>
      (function () {
        var t = localStorage.getItem("jsonld_theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --border-color: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-indigo: #6366f1;
        --accent-blue: #38bdf8;
        --accent-purple: #a855f7;
        --font-sans: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --font-heading: "Oxanium", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --bg-primary: #f8fafc;
          --bg-secondary: #ffffff;
          --bg-tertiary: #f1f5f9;
          --border-color: #cbd5e1;
          --text-primary: #0f172a;
          --text-secondary: #475569;
          --accent-indigo: #4f46e5;
          --accent-blue: #0284c7;
          --accent-purple: #9333ea;
        }
      }

      [data-theme="dark"] {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --border-color: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-indigo: #6366f1;
        --accent-blue: #38bdf8;
        --accent-purple: #a855f7;
      }

      [data-theme="light"] {
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f1f5f9;
        --border-color: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --accent-indigo: #4f46e5;
        --accent-blue: #0284c7;
        --accent-purple: #9333ea;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        transition:
          background-color 0.2s,
          color 0.2s;
      }

      header {
        background-color: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .logo-group h1 {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .logo-group p {
        color: var(--text-secondary);
        font-size: 0.875rem;
        margin-top: 0.25rem;
      }

      .theme-btn {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s;
      }

      .theme-btn:hover {
        border-color: var(--accent-indigo);
      }

      main {
        max-width: 1300px;
        width: 100%;
        margin: 2rem auto;
        padding: 0 1.5rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .toolbar {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1rem 1.25rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .schema-picker {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .schema-picker label {
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      select.schema-select {
        background: var(--bg-tertiary);
        border: 1.5px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-family: var(--font-sans);
        font-size: 0.9375rem;
        font-weight: 700;
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s;
      }

      select.schema-select:focus {
        border-color: var(--accent-indigo);
      }

      .preset-chips {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .preset-chip {
        background: var(--bg-tertiary);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .preset-chip:hover {
        background: var(--accent-indigo);
        color: #fff;
        border-color: var(--accent-indigo);
      }

      .workbench {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }

      .panel {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.75rem;
      }

      .panel-header h2 {
        font-family: var(--font-heading);
        font-size: 1.125rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .form-grid {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-height: 650px;
        overflow-y: auto;
        padding-right: 0.5rem;
      }

      .form-row {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .form-row label {
        font-size: 0.8125rem;
        font-weight: 700;
        color: var(--text-secondary);
      }

      input[type="text"],
      input[type="url"],
      input[type="number"],
      input[type="date"],
      textarea {
        background: var(--bg-tertiary);
        border: 1.5px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.6rem 0.85rem;
        border-radius: 8px;
        font-family: var(--font-sans);
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.2s;
        width: 100%;
      }

      input:focus,
      textarea:focus {
        border-color: var(--accent-indigo);
      }

      textarea {
        resize: vertical;
        min-height: 80px;
      }

      .dynamic-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .dynamic-item {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        position: relative;
      }

      .remove-btn {
        align-self: flex-end;
        background: none;
        border: none;
        color: #f87171;
        cursor: pointer;
        font-size: 0.8125rem;
        font-weight: 700;
      }

      .remove-btn:hover {
        text-decoration: underline;
      }

      .add-btn {
        background: var(--bg-tertiary);
        border: 1.5px dashed var(--border-color);
        color: var(--accent-blue);
        padding: 0.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.8125rem;
        font-weight: 700;
        text-align: center;
        transition: all 0.2s;
      }

      .add-btn:hover {
        border-color: var(--accent-blue);
        background: rgba(56, 189, 248, 0.1);
      }

      .output-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .action-btn {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.45rem 0.85rem;
        border-radius: 6px;
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        transition: all 0.2s;
      }

      .action-btn:hover {
        background: var(--accent-indigo);
        color: #fff;
        border-color: var(--accent-indigo);
      }

      .action-btn.primary {
        background: var(--accent-indigo);
        color: #fff;
        border-color: var(--accent-indigo);
      }

      .output-container {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      pre {
        background: #090d16;
        color: #e2e8f0;
        padding: 1.25rem;
        border-radius: 10px;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        overflow-x: auto;
        flex: 1;
        max-height: 580px;
        line-height: 1.5;
        border: 1px solid #1e293b;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
        border: 1px solid #22c55e;
      }

      footer {
        background-color: var(--bg-secondary);
        border-top: 1px solid var(--border-color);
        padding: 1.5rem;
        text-align: center;
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      footer a {
        color: var(--accent-blue);
        text-decoration: none;
        font-weight: 600;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 900px) {
        .workbench {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-group">
        <h1>📐 JSON-LD Schema.org Generator</h1>
        <p>Zero-dependency structured data builder for SEO rich results</p>
      </div>
      <button id="themeToggle" class="theme-btn" aria-label="Toggle theme"><span id="themeIcon">☀️</span> <span id="themeText">Toggle Theme</span></button>
    </header>

    <main>
      <section class="toolbar" aria-label="Schema Selection Toolbar">
        <div class="schema-picker">
          <label for="schemaType">Schema Type:</label>
          <select id="schemaType" class="schema-select">
            <option value="Article">📰 Article / Blog Post</option>
            <option value="Product">🛍️ Product & Offers</option>
            <option value="FAQPage">❓ FAQ Page</option>
            <option value="LocalBusiness">📍 Local Business</option>
            <option value="Person">👤 Person / Profile</option>
            <option value="BreadcrumbList">🍞 Breadcrumb List</option>
            <option value="Event">📅 Event / Conference</option>
          </select>
        </div>
        <div class="preset-chips">
          <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-secondary)">Presets:</span>
          <button class="preset-chip" data-preset="tech-article">Tech Article</button>
          <button class="preset-chip" data-preset="ecommerce-item">E-Commerce Sneaker</button>
          <button class="preset-chip" data-preset="faq-demo">Software FAQ</button>
          <button class="preset-chip" data-preset="coffee-shop">Coffee Shop</button>
        </div>
      </section>

      <div class="workbench">
        <!-- Input Form -->
        <section class="panel" aria-labelledby="form-heading">
          <div class="panel-header">
            <h2 id="form-heading">📝 Configure Schema Fields</h2>
            <span class="status-pill">Validated Schema.org</span>
          </div>
          <div class="form-grid" id="formFieldsContainer">
            <!-- Dynamically populated based on Schema Type -->
          </div>
        </section>

        <!-- Live Output Preview -->
        <section class="panel" aria-labelledby="output-heading">
          <div class="panel-header">
            <h2 id="output-heading">💻 Generated JSON-LD</h2>
            <div class="output-actions">
              <button id="copyScriptBtn" class="action-btn primary">Copy &lt;script&gt;</button>
              <button id="copyJsonBtn" class="action-btn">Copy JSON</button>
              <button id="downloadBtn" class="action-btn">Download .jsonld</button>
              <button id="testGoogleBtn" class="action-btn">Google Rich Test</button>
            </div>
          </div>
          <div class="output-container">
            <pre><code id="jsonLdOutput"></code></pre>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <p>Built with ❤️ for <a href="https://github.com/praveenscience/One-File-Tools" target="_blank" rel="noopener noreferrer">One File Tools</a>. Zero build step. Zero dependencies. Open and run anywhere.</p>
    </footer>

    <script>
      const schemaTypeSelect = document.getElementById("schemaType");
      const formContainer = document.getElementById("formFieldsContainer");
      const jsonLdOutput = document.getElementById("jsonLdOutput");
      const copyScriptBtn = document.getElementById("copyScriptBtn");
      const copyJsonBtn = document.getElementById("copyJsonBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const testGoogleBtn = document.getElementById("testGoogleBtn");
      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");

      // Theme toggle
      let currentTheme = localStorage.getItem("jsonld_theme") || "dark";
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeIcon.textContent = theme === "dark" ? "☀️" : "🌙";
        localStorage.setItem("jsonld_theme", theme);
      }
      applyTheme(currentTheme);
      themeToggle.addEventListener("click", () => {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(currentTheme);
      });

      // State
      let schemaData = {
        Article: {
          headline: "Demystifying Modern Web Architecture in 2026",
          description: "An in-depth guide to building ultra-fast zero-dependency single-file applications with modern web APIs.",
          author: "Mohan Sriram",
          publisher: "IEEE Contributor Network",
          url: "https://example.com/articles/modern-web",
          image: "https://example.com/images/web-arch.png",
          datePublished: "2026-11-15",
          dateModified: "2026-11-15"
        },
        Product: {
          name: "AeroGlide Ultralight Running Shoes",
          description: "Engineered for marathon runners with responsive carbon-fiber plate cushioning.",
          brand: "AeroSport",
          sku: "AG-RUN-2026",
          image: "https://example.com/images/shoe.jpg",
          price: "149.99",
          priceCurrency: "USD",
          availability: "https://schema.org/InStock"
        },
        FAQPage: {
          items: [
            { question: "What is a single-file developer tool?", answer: "A tool whose HTML, CSS, and JS live in a single self-contained file with zero build step." },
            { question: "Are CDN libraries supported?", answer: "Yes, CDN links for lightweight fonts and utilities are encouraged." }
          ]
        },
        LocalBusiness: {
          name: "Blue Mountain Specialty Coffee",
          address: "742 Evergreen Terrace",
          city: "Springfield",
          phone: "+1-555-0199",
          priceRange: "$$",
          url: "https://bluemountaincoffee.example.com",
          openingHours: "Mo-Fr 07:00-19:00"
        },
        Person: {
          name: "Alex Mercer",
          jobTitle: "Principal Distributed Systems Engineer",
          url: "https://alexmercer.dev",
          company: "Acme Tech Labs",
          social: "https://github.com/praveenscience, https://twitter.com/dev"
        },
        BreadcrumbList: {
          items: [
            { name: "Home", url: "https://example.com" },
            { name: "Developer Tools", url: "https://example.com/tools" },
            { name: "JSON-LD Generator", url: "https://example.com/tools/json-ld" }
          ]
        },
        Event: {
          name: "Global Open Source & AI Summit 2026",
          startDate: "2026-12-05T09:00",
          endDate: "2026-12-07T18:00",
          locationName: "Metropolitan Tech Pavilion",
          address: "100 Innovation Way, San Francisco, CA",
          url: "https://summit.example.com"
        }
      };

      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      function renderForm() {
        const type = schemaTypeSelect.value;
        const data = schemaData[type];
        formContainer.innerHTML = "";

        if (type === "Article") {
          formContainer.innerHTML = `
            <div class="form-row"><label for="f_headline">Headline / Title</label><input type="text" id="f_headline" value="${escapeHtml(data.headline)}" /></div>
            <div class="form-row"><label for="f_desc">Description / Excerpt</label><textarea id="f_desc">${escapeHtml(data.description)}</textarea></div>
            <div class="form-row"><label for="f_author">Author Name</label><input type="text" id="f_author" value="${escapeHtml(data.author)}" /></div>
            <div class="form-row"><label for="f_publisher">Publisher Name</label><input type="text" id="f_publisher" value="${escapeHtml(data.publisher)}" /></div>
            <div class="form-row"><label for="f_url">Canonical Article URL</label><input type="url" id="f_url" value="${escapeHtml(data.url)}" /></div>
            <div class="form-row"><label for="f_image">Featured Image URL</label><input type="url" id="f_image" value="${escapeHtml(data.image)}" /></div>
            <div class="form-row"><label for="f_pubDate">Date Published</label><input type="date" id="f_pubDate" value="${escapeHtml(data.datePublished)}" /></div>
            <div class="form-row"><label for="f_modDate">Date Modified</label><input type="date" id="f_modDate" value="${escapeHtml(data.dateModified)}" /></div>
          `;
          bindInputs(type, ["headline:f_headline", "description:f_desc", "author:f_author", "publisher:f_publisher", "url:f_url", "image:f_image", "datePublished:f_pubDate", "dateModified:f_modDate"]);
        } else if (type === "Product") {
          formContainer.innerHTML = `
            <div class="form-row"><label for="f_name">Product Name</label><input type="text" id="f_name" value="${escapeHtml(data.name)}" /></div>
            <div class="form-row"><label for="f_desc">Description</label><textarea id="f_desc">${escapeHtml(data.description)}</textarea></div>
            <div class="form-row"><label for="f_brand">Brand</label><input type="text" id="f_brand" value="${escapeHtml(data.brand)}" /></div>
            <div class="form-row"><label for="f_sku">SKU</label><input type="text" id="f_sku" value="${escapeHtml(data.sku)}" /></div>
            <div class="form-row"><label for="f_image">Image URL</label><input type="url" id="f_image" value="${escapeHtml(data.image)}" /></div>
            <div class="form-row"><label for="f_price">Price</label><input type="number" step="0.01" id="f_price" value="${escapeHtml(data.price)}" /></div>
            <div class="form-row"><label for="f_curr">Currency</label><input type="text" id="f_curr" value="${escapeHtml(data.priceCurrency)}" /></div>
          `;
          bindInputs(type, ["name:f_name", "description:f_desc", "brand:f_brand", "sku:f_sku", "image:f_image", "price:f_price", "priceCurrency:f_curr"]);
        } else if (type === "FAQPage") {
          let itemsHtml = data.items
            .map(
              (item, i) => `
            <div class="dynamic-item" data-index="${i}">
              <button class="remove-btn" onclick="removeFAQ(${i})">✕ Remove</button>
              <div class="form-row"><label>Question</label><input type="text" class="faq-q" value="${escapeHtml(item.question)}" /></div>
              <div class="form-row"><label>Answer</label><textarea class="faq-a">${escapeHtml(item.answer)}</textarea></div>
            </div>
          `
            )
            .join("");
          formContainer.innerHTML = `
            <div class="dynamic-list" id="faqList">${itemsHtml}</div>
            <button class="add-btn" id="addFaqBtn">+ Add Question & Answer</button>
          `;
          document.getElementById("addFaqBtn").addEventListener("click", () => {
            schemaData.FAQPage.items.push({ question: "New Question?", answer: "Answer to question." });
            renderForm();
          });
          document.querySelectorAll(".faq-q, .faq-a").forEach((el) => {
            el.addEventListener("input", syncFAQ);
          });
        } else if (type === "LocalBusiness") {
          formContainer.innerHTML = `
            <div class="form-row"><label for="f_name">Business Name</label><input type="text" id="f_name" value="${escapeHtml(data.name)}" /></div>
            <div class="form-row"><label for="f_address">Street Address</label><input type="text" id="f_address" value="${escapeHtml(data.address)}" /></div>
            <div class="form-row"><label for="f_city">City</label><input type="text" id="f_city" value="${escapeHtml(data.city)}" /></div>
            <div class="form-row"><label for="f_phone">Telephone</label><input type="text" id="f_phone" value="${escapeHtml(data.phone)}" /></div>
            <div class="form-row"><label for="f_price">Price Range (e.g. $, $$, $$$)</label><input type="text" id="f_price" value="${escapeHtml(data.priceRange)}" /></div>
            <div class="form-row"><label for="f_url">Website URL</label><input type="url" id="f_url" value="${escapeHtml(data.url)}" /></div>
            <div class="form-row"><label for="f_hours">Opening Hours</label><input type="text" id="f_hours" value="${escapeHtml(data.openingHours)}" /></div>
          `;
          bindInputs(type, ["name:f_name", "address:f_address", "city:f_city", "phone:f_phone", "priceRange:f_price", "url:f_url", "openingHours:f_hours"]);
        } else if (type === "Person") {
          formContainer.innerHTML = `
            <div class="form-row"><label for="f_name">Full Name</label><input type="text" id="f_name" value="${escapeHtml(data.name)}" /></div>
            <div class="form-row"><label for="f_job">Job Title</label><input type="text" id="f_job" value="${escapeHtml(data.jobTitle)}" /></div>
            <div class="form-row"><label for="f_company">Organization / Affiliation</label><input type="text" id="f_company" value="${escapeHtml(data.company)}" /></div>
            <div class="form-row"><label for="f_url">Website / Portfolio URL</label><input type="url" id="f_url" value="${escapeHtml(data.url)}" /></div>
            <div class="form-row"><label for="f_social">Social Profiles (comma-separated URLs)</label><input type="text" id="f_social" value="${escapeHtml(data.social)}" /></div>
          `;
          bindInputs(type, ["name:f_name", "jobTitle:f_job", "company:f_company", "url:f_url", "social:f_social"]);
        } else if (type === "BreadcrumbList") {
          let itemsHtml = data.items
            .map(
              (item, i) => `
            <div class="dynamic-item">
              <button class="remove-btn" onclick="removeBreadcrumb(${i})">✕ Remove</button>
              <div class="form-row"><label>Level ${i + 1} Name</label><input type="text" class="bc-name" value="${escapeHtml(item.name)}" /></div>
              <div class="form-row"><label>URL</label><input type="url" class="bc-url" value="${escapeHtml(item.url)}" /></div>
            </div>
          `
            )
            .join("");
          formContainer.innerHTML = `
            <div class="dynamic-list">${itemsHtml}</div>
            <button class="add-btn" id="addBcBtn">+ Add Breadcrumb Level</button>
          `;
          document.getElementById("addBcBtn").addEventListener("click", () => {
            schemaData.BreadcrumbList.items.push({ name: "Page", url: "https://example.com/page" });
            renderForm();
          });
          document.querySelectorAll(".bc-name, .bc-url").forEach((el) => {
            el.addEventListener("input", syncBreadcrumbs);
          });
        } else if (type === "Event") {
          formContainer.innerHTML = `
            <div class="form-row"><label for="f_name">Event Name</label><input type="text" id="f_name" value="${escapeHtml(data.name)}" /></div>
            <div class="form-row"><label for="f_start">Start Date & Time</label><input type="text" id="f_start" value="${escapeHtml(data.startDate)}" /></div>
            <div class="form-row"><label for="f_end">End Date & Time</label><input type="text" id="f_end" value="${escapeHtml(data.endDate)}" /></div>
            <div class="form-row"><label for="f_loc">Location / Venue Name</label><input type="text" id="f_loc" value="${escapeHtml(data.locationName)}" /></div>
            <div class="form-row"><label for="f_addr">Physical Address</label><input type="text" id="f_addr" value="${escapeHtml(data.address)}" /></div>
            <div class="form-row"><label for="f_url">Event URL</label><input type="url" id="f_url" value="${escapeHtml(data.url)}" /></div>
          `;
          bindInputs(type, ["name:f_name", "startDate:f_start", "endDate:f_end", "locationName:f_loc", "address:f_addr", "url:f_url"]);
        }

        updateJsonLd();
      }

      function bindInputs(type, mappings) {
        mappings.forEach((m) => {
          const [prop, id] = m.split(":");
          const el = document.getElementById(id);
          if (el) {
            el.addEventListener("input", () => {
              schemaData[type][prop] = el.value;
              updateJsonLd();
            });
          }
        });
      }

      window.removeFAQ = function (index) {
        schemaData.FAQPage.items.splice(index, 1);
        renderForm();
      };

      function syncFAQ() {
        const questions = document.querySelectorAll(".faq-q");
        const answers = document.querySelectorAll(".faq-a");
        schemaData.FAQPage.items = [];
        questions.forEach((q, i) => {
          schemaData.FAQPage.items.push({
            question: q.value,
            answer: answers[i].value
          });
        });
        updateJsonLd();
      }

      window.removeBreadcrumb = function (index) {
        schemaData.BreadcrumbList.items.splice(index, 1);
        renderForm();
      };

      function syncBreadcrumbs() {
        const names = document.querySelectorAll(".bc-name");
        const urls = document.querySelectorAll(".bc-url");
        schemaData.BreadcrumbList.items = [];
        names.forEach((n, i) => {
          schemaData.BreadcrumbList.items.push({
            name: n.value,
            url: urls[i].value
          });
        });
        updateJsonLd();
      }

      function generateStructuredJson() {
        const type = schemaTypeSelect.value;
        const d = schemaData[type];

        if (type === "Article") {
          return {
            "@context": "https://schema.org",
            "@type": "Article",
            headline: d.headline,
            description: d.description,
            image: d.image,
            author: {
              "@type": "Person",
              name: d.author
            },
            publisher: {
              "@type": "Organization",
              name: d.publisher
            },
            datePublished: d.datePublished,
            dateModified: d.dateModified,
            mainEntityOfPage: {
              "@type": "WebPage",
              "@id": d.url
            }
          };
        } else if (type === "Product") {
          return {
            "@context": "https://schema.org",
            "@type": "Product",
            name: d.name,
            image: d.image,
            description: d.description,
            sku: d.sku,
            brand: {
              "@type": "Brand",
              name: d.brand
            },
            offers: {
              "@type": "Offer",
              url: d.image,
              priceCurrency: d.priceCurrency,
              price: d.price,
              availability: d.availability
            }
          };
        } else if (type === "FAQPage") {
          return {
            "@context": "https://schema.org",
            "@type": "FAQPage",
            mainEntity: d.items.map((item) => ({
              "@type": "Question",
              name: item.question,
              acceptedAnswer: {
                "@type": "Answer",
                text: item.answer
              }
            }))
          };
        } else if (type === "LocalBusiness") {
          return {
            "@context": "https://schema.org",
            "@type": "LocalBusiness",
            name: d.name,
            image: "https://example.com/store.jpg",
            telephone: d.phone,
            priceRange: d.priceRange,
            address: {
              "@type": "PostalAddress",
              streetAddress: d.address,
              addressLocality: d.city
            },
            openingHours: d.openingHours,
            url: d.url
          };
        } else if (type === "Person") {
          const socials = d.social
            .split(",")
            .map((s) => s.trim())
            .filter(Boolean);
          return {
            "@context": "https://schema.org",
            "@type": "Person",
            name: d.name,
            jobTitle: d.jobTitle,
            worksFor: {
              "@type": "Organization",
              name: d.company
            },
            url: d.url,
            sameAs: socials
          };
        } else if (type === "BreadcrumbList") {
          return {
            "@context": "https://schema.org",
            "@type": "BreadcrumbList",
            itemListElement: d.items.map((item, idx) => ({
              "@type": "ListItem",
              position: idx + 1,
              name: item.name,
              item: item.url
            }))
          };
        } else if (type === "Event") {
          return {
            "@context": "https://schema.org",
            "@type": "Event",
            name: d.name,
            startDate: d.startDate,
            endDate: d.endDate,
            eventAttendanceMode: "https://schema.org/OfflineEventAttendanceMode",
            eventStatus: "https://schema.org/EventScheduled",
            location: {
              "@type": "Place",
              name: d.locationName,
              address: {
                "@type": "PostalAddress",
                streetAddress: d.address
              }
            },
            url: d.url
          };
        }
      }

      function updateJsonLd() {
        const json = generateStructuredJson();
        const formatted = JSON.stringify(json, null, 2);
        jsonLdOutput.textContent = `<script type="application/ld+json">\n${formatted}\n<\/script>`;
      }

      schemaTypeSelect.addEventListener("change", renderForm);

      // Copy & actions
      copyScriptBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(jsonLdOutput.textContent).then(() => {
          copyScriptBtn.textContent = "Copied! ✅";
          setTimeout(() => (copyScriptBtn.textContent = "Copy <script>"), 2000);
        });
      });

      copyJsonBtn.addEventListener("click", () => {
        const rawJson = JSON.stringify(generateStructuredJson(), null, 2);
        navigator.clipboard.writeText(rawJson).then(() => {
          copyJsonBtn.textContent = "Copied! ✅";
          setTimeout(() => (copyJsonBtn.textContent = "Copy JSON"), 2000);
        });
      });

      downloadBtn.addEventListener("click", () => {
        const rawJson = JSON.stringify(generateStructuredJson(), null, 2);
        const blob = new Blob([rawJson], { type: "application/ld+json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${schemaTypeSelect.value.toLowerCase()}-schema.jsonld`;
        a.click();
        URL.revokeObjectURL(url);
      });

      testGoogleBtn.addEventListener("click", () => {
        window.open("https://search.google.com/test/rich-results", "_blank");
      });

      // Presets
      document.querySelectorAll(".preset-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          const p = btn.getAttribute("data-preset");
          if (p === "tech-article") schemaTypeSelect.value = "Article";
          if (p === "ecommerce-item") schemaTypeSelect.value = "Product";
          if (p === "faq-demo") schemaTypeSelect.value = "FAQPage";
          if (p === "coffee-shop") schemaTypeSelect.value = "LocalBusiness";
          renderForm();
        });
      });

      // Initial render
      renderForm();
    </script>
  </body>
</html>
