<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Robots.txt Generator — One File Tools</title>
    <style>
      :root {
        --app-bg: #0d1117;
        --app-text: #c9d1d9;
        --app-primary: #58a6ff;
        --app-primary-hover: #79c0ff;
        --app-secondary: #21262d;
        --app-panel: #161b22;
        --app-border: #30363d;
        --accent-orange: #f0883e;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', -apple-system, sans-serif;
        background-color: var(--app-bg);
        color: var(--app-text);
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      header { text-align: center; margin-bottom: 2rem; }
      h1 { color: var(--app-primary); font-size: 2rem; margin-bottom: 0.5rem; }

      main {
        width: 100%;
        max-width: 1000px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }

      @media (max-width: 768px) {
        main { grid-template-columns: 1fr; }
      }

      .panel {
        background: var(--app-panel);
        border: 1px solid var(--app-border);
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      h2 { font-size: 1.2rem; border-bottom: 1px solid var(--app-border); padding-bottom: 0.5rem; }

      .field-group { display: flex; flex-direction: column; gap: 0.5rem; }
      label { font-size: 0.85rem; font-weight: bold; color: #8b949e; }
      
      input[type="text"], select {
        width: 100%;
        padding: 0.8rem;
        border-radius: 6px;
        border: 1px solid var(--app-border);
        background: var(--app-bg);
        color: var(--app-text);
      }

      .rule-row {
        display: grid;
        grid-template-columns: 100px 1fr 40px;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        align-items: center;
      }

      .btn {
        background: var(--app-secondary);
        color: var(--app-text);
        border: 1px solid var(--app-border);
        padding: 0.6rem 1.2rem;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }
      .btn:hover { background: var(--app-primary); color: #000; }
      .btn-danger { background: #da3633; color: white; padding: 0.5rem; border: none; }

      pre {
        background: var(--app-bg);
        padding: 1rem;
        border-radius: 6px;
        border: 1px solid var(--app-border);
        overflow-x: auto;
        font-family: monospace;
        font-size: 1rem;
        color: var(--accent-orange);
        min-height: 200px;
      }

      .robot-select {
        margin-bottom: 1rem;
      }

    </style>
  </head>
  <body>
    <header>
      <h1>Advanced Robots.txt Generator</h1>
      <p>Configure and generate perfectly formatted robots.txt rules instantly.</p>
    </header>

    <main>
      <div class="panel">
        <h2>Rules Configuration</h2>
        
        <div class="field-group">
          <label>User Agent (Robot)</label>
          <select id="userAgent" onchange="generateRobots()">
            <option value="*">All Robots (*)</option>
            <option value="Googlebot">Googlebot (Google)</option>
            <option value="Bingbot">Bingbot (Bing)</option>
            <option value="Slurp">Slurp (Yahoo)</option>
            <option value="DuckDuckBot">DuckDuckBot</option>
            <option value="Baiduspider">Baiduspider (Baidu)</option>
            <option value="YandexBot">YandexBot</option>
          </select>
        </div>

        <div class="field-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label>Path Rules</label>
            <button class="btn" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="addRule()">+ Add Rule</button>
          </div>
          <div id="rulesContainer"></div>
        </div>

        <div class="field-group">
          <label>Sitemap URL</label>
          <input type="text" id="sitemap" placeholder="https://example.com/sitemap.xml" oninput="generateRobots()">
        </div>

        <div class="field-group">
          <label>Crawl-delay (seconds)</label>
          <input type="text" id="crawldelay" placeholder="e.g. 10 (Leave blank for none)" oninput="generateRobots()">
        </div>
      </div>

      <div class="panel">
        <h2>Generated robots.txt</h2>
        <pre id="output"></pre>
        <button class="btn" style="background: var(--app-primary); color: #000;" onclick="copyRobots()">Copy to Clipboard</button>
        <button class="btn" onclick="downloadRobots()">Download .txt</button>
      </div>
    </main>

    <script>
      let rules = [
        { type: 'Disallow', path: '/admin/' }
      ];

      function renderRules() {
        const container = document.getElementById('rulesContainer');
        container.innerHTML = '';
        rules.forEach((rule, index) => {
          const row = document.createElement('div');
          row.className = 'rule-row';
          row.innerHTML = `
            <select onchange="updateRule(${index}, 'type', this.value)">
              <option value="Disallow" ${rule.type === 'Disallow' ? 'selected' : ''}>Disallow</option>
              <option value="Allow" ${rule.type === 'Allow' ? 'selected' : ''}>Allow</option>
            </select>
            <input type="text" value="${rule.path}" placeholder="/path/to/folder/" oninput="updateRule(${index}, 'path', this.value)">
            <button class="btn-danger" onclick="removeRule(${index})">X</button>
          `;
          container.appendChild(row);
        });
        generateRobots();
      }

      window.addRule = () => {
        rules.push({ type: 'Disallow', path: '/' });
        renderRules();
      };

      window.removeRule = (index) => {
        rules.splice(index, 1);
        renderRules();
      };

      window.updateRule = (index, field, value) => {
        rules[index][field] = value;
        generateRobots();
      };

      window.generateRobots = () => {
        const ua = document.getElementById('userAgent').value;
        const sitemap = document.getElementById('sitemap').value;
        const delay = document.getElementById('crawldelay').value;

        let out = `User-agent: ${ua}\n`;
        
        rules.forEach(rule => {
          if(rule.path) {
            out += `${rule.type}: ${rule.path}\n`;
          }
        });

        if (delay) {
          out += `Crawl-delay: ${delay}\n`;
        }

        if (sitemap) {
          out += `\nSitemap: ${sitemap}\n`;
        }

        document.getElementById('output').textContent = out;
      };

      window.copyRobots = () => {
        navigator.clipboard.writeText(document.getElementById('output').textContent);
        alert('Copied to clipboard!');
      };

      window.downloadRobots = () => {
        const text = document.getElementById('output').textContent;
        const a = document.createElement('a');
        a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(text);
        a.download = "robots.txt";
        a.click();
      };

      // Init
      renderRules();
    </script>
  </body>
</html>
