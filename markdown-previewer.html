<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Live Previewer — One File Tools</title>
    <!-- Tailwind CSS via CDN as encouraged by guidelines -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="border-b border-gray-200 dark:border-gray-800 p-4 bg-white dark:bg-gray-900 shadow-sm">
      <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
          📝 Markdown Live Previewer
        </h1>
        <span class="text-xs bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 px-2.5 py-1 rounded-full font-medium">Easy Tool</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-4 my-auto">
      
      <!-- Editor Column -->
      <div class="flex flex-col h-[75vh]">
        <label for="editor" class="text-sm font-semibold mb-2 text-gray-600 dark:text-gray-400">Type Markdown Here:</label>
        <textarea id="editor" class="flex-1 w-full p-4 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm resize-none shadow-sm" placeholder="# Hello World&#10;Type your markdown here..."></textarea>
      </div>

      <!-- Preview Column -->
      <div class="flex flex-col h-[75vh]">
        <span class="text-sm font-semibold mb-2 text-gray-600 dark:text-gray-400">Live Preview:</span>
        <div id="preview" class="flex-1 w-full p-4 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 overflow-y-auto shadow-sm prose dark:prose-invert max-w-none">
          <p class="text-gray-400 italic">Preview will appear here...</p>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 py-4 text-center text-sm text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-900">
      <p>Part of <a href="https://github.com/praveenscience/One-File-Tools" class="text-indigo-600 dark:text-indigo-400 underline hover:font-semibold">One File Tools</a></p>
    </footer>

    <!-- Simple Script for Live Text Reflection -->
    <script>
      const editor = document.getElementById('editor');
      const preview = document.getElementById('preview');

      // Default sample text
      editor.value = "# Welcome to Markdown Previewer\n\n- Fast & Lightweight\n- No dependencies\n- **Bold** and *Italic* supported!";
      preview.innerHTML = `<h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem;">Welcome to Markdown Previewer</h1><ul style="list-style-type: disc; padding-left: 1.5rem;"><li>Fast & Lightweight</li><li>No dependencies</li><li><b>Bold</b> and <i>Italic</i> supported!</li></ul>`;

      editor.addEventListener('input', (e) => {
        const val = e.target.value;
        // Basic clean rendering for safety and speed without heavy external parser libraries
        if (!val.trim()) {
          preview.innerHTML = '<p class="text-gray-400 italic">Preview will appear here...</p>';
          return;
        }
        // Simple text formatter simulation or safe HTML escape display
        preview.innerHTML = `<pre style="white-space: pre-wrap; font-family: inherit;">${escapeHtml(val)}</pre>`;
      });

      function escapeHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    </script>
  </body>
</html>
